name: DEV-Schemachange-Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - feature/DD-*
      - update/DD-*
      - fix/DD-*
      - bug/DD-*

permissions:
  id-token: write
  contents: write

env:
  ENV: "dev"
  SNOWFLAKE_PRIVATE_KEY_PATH: github_integration_user_private_key.p8
  RUNNER_ROLE: arn:aws:iam::012345678901:role/GitHubRunnerRole

jobs:
  dev-schemachange-deploy:
    name: DEV-Schemachange-Deploy
    runs-on: [non-prod,deploy]
    environment: dev
    env:
      GITHUB_ACTIONS_ID: ${{ github.run_id }}
    steps:
      - name: Assume Role
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ env.RUNNER_ROLE }}
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Fetch Snowflake Creds
        uses: aws-actions/aws-secretsmanager-get-secrets@v1
        with:
          secret-ids: |
            SNOWFLAKE_PRIVATE_KEY,secret_path/snowflake-github-user-private-key
            SNOWFLAKE_PRIVATE_KEY_PASSPHRASE,secret_path/snowflake-github-user-passphrase

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Schemachange
        uses: actions/checkout@v3
        with:
          repository: PEXA-AU/pexa-one-data-snowflake-au-common-lib
          ref: main
          path: .github/actions/schemachange
          # token: ${{ secrets.REPO_ACCESS_GITHUB_ACTIONS }}

      - name: Inject modules
        uses: .github/actions/schemachange/schemachange
        with:
          schemachange-folder: schemachange

      - name: Do a dry run first
        uses: .github/actions/schemachange/apply
        with:
          schemachange-folder: schemachange
          dry-run: true

      - name: Actually apply the changes
        uses: .github/actions/schemachange/apply
        with:
          schemachange-folder: schemachange
          dry-run: false