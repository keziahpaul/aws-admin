name: 'SchemaChange Common Core'
description: |
  Action for applying Schemachange common objects to the current workspace

inputs:
  schemachange-folder:
    description: 'Path to the local schemachange folder'
    required: true

  modules-only:
    description: 'Only copy the modules folder into the local schemachange folder. Default: true'
    required: false
    default: true

  overwrite:
    description: 'Action to take when conflicting file names are found. Default: true'
    required: false
    default: true

  ignore-fail:
    description: 'Action to take when a conflicting file name was found. Default: false'
    required: false
    default: false

runs:
  using: "composite"

  steps:
    - name: Verify target
      id: verify
      if: ${{ inputs.overwrite == "false" }}
      run: |
        modules={{ inputs.modules-only }}
        ignore={{ inputs.ignore-fail }}
        echo "Checking ${{ inputs.schemachange-folder }} for pre-existing files"
        # actually check
        if [[ "${modules,,}" == "true" ]]; then
          echo "Checking modules only"
        else
          echo "Checking everything"
        fi
        if [[ "${ignore,,}" == "false" ]]; then
          exit 1
        fi

    - name: Apply files
      run: |
        modules={{ inputs.modules-only }}
        echo "Copying files from ${{ github.action_path }}/schemachange to ${{ inputs.schemachange-folder }}"
        if [[ "${modules,,}" == "true" ]]; then
          echo "Copying modules only"
          # cp -r ${{ github.action_path }}/schemachange/modules ${{ inputs.schemachange-path }}
          # find ${{ inputs.schemachange-path }} -type f
        else
          echo "Copying everything"
        fi
