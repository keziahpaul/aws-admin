config-version: 1

root-folder: schemachange
modules-folder: schemachange/modules
vars:
  in_sf_env: {{env_var('SF_ENV','DEV')}}
  in_sf_acc_name: {{env_var('account','BLANK')}}
  nonprod_ip_list: "('10.176.64.0/20', '10.176.80.0/20', '10.176.96.0/20', '10.180.64.0/20', '10.180.80.0/20', '10.180.96.0/20')"
  prod_ip_list: "('10.243.64.0/20', '10.243.80.0/20','10.243.96.0/20', '10.240.64.0/20', '10.240.80.0/20', '10.240.96.0/20')"

  data_aws_account_no: '{{env_var('DATA_AWS_ACCOUNT','BLANK')}}'
  log_aws_account_no: '{{env_var('AWS_LOGGING_ACCOUNT','BLANK')}}'
  log_iam_role: '{{env_var('AWS_LOGGING_ROLE','BLANK')}}'
  log_s3_path: pexa-one-data-logs-secops-bucket
  log_s3_key: ONEData/
  log_external_id: {{env_var('ACCOUNT_NAME','BLANK')}}_SFCRole=_logging_s3_integration
  log_kms_key_id: '{{env_var('AWS_LOGGING_KMS_KEY','BLANK')}}'


  in_sf_external_id: '{{env_var('SF_ACCOUNT_ID','BLANK')}}_SFCRole='

  in_pdg_account_no: '{{env_var('AWS_ACCOUNT_1','BLANK')}}'
  in_va_pdg_role_name: 'etl-onedata-value-australia-snowflake-integration-role'
  in_pdg_s3_bucket: 'external-storage-onedata-snowflake-{{env_var('AWS_ACCOUNT_1','BLANK') }}-ap-southeast-2'
  in_ingress_s3_bucket: 'onedata-ingress-{{env_var('DATA_AWS_ACCOUNT','BLANK') }}-{{env_var('SF_ENV','dev')}}'
  in_value_australia_s3_key: 'value-australia'

  in_li_pdg_role_name: 'etl-onedata-land-insights-snowflake-integration-role'
  in_landinsights_s3_key: 'Processed'

  in_exchange_account_no: '{{env_var('AWS_ACCOUNT_1','BLANK')}}'
  in_exchange_api_logs_role_name: 'onedata-snowflake-coreegress-role'
  in_exchange_api_logs_s3_bucket: '{{env_var('AWS_S3_BUCKET','BLANK')}}'

  in_statement_timeout_at: "{{env_var('IN_STATEMENT_TIMEOUT_AT', '3600')}}"
  in_pexakey_rds_nlp_name: {{env_var('PEXAKEY_RDS_NLP_NAME','')}} #default: dev-snowflake-privatelink-nlb-c55708b6ac172e51.elb.ap-southeast-2.amazonaws.com
  in_pexakey_rds_username: {{env_var('PEXAKEY_RDS_USERNAME','')}}
  in_pexakey_rds_password: {{env_var('PEXAKEY_RDS_PASSWORD','')}}
  in_push_not_rds_username: {{env_var('PUSH_NOT_RDS_USERNAME','')}}
  in_push_not_rds_password: {{env_var('PUSH_NOT_RDS_PASSWORD','')}}

  params_dict:
    alert_slack_email: "'onedata-snowflake-tru-aaaamvewbztmeetggmkveivn6i@pexa.slack.com'"
    prd_onedata_alert_slack_email: "'onedata-prod-notifica-aaaalrmc5cx4jrh2ml3csxqn4m@pexa.slack.com'"
    dev_onedata_alert_slack_email: "'aws-dev-notifications-aaaalrfnrop2do7qi33r4ahvgi@pexa.slack.com'"

#SNOWFLAKE Account is defaulted to Sandbox Account id 'JU46907'
snowflake-account: '{{env_var('ACCOUNT_NAME','JU46907')}}.{{env_var('SF_REGION','ap-southeast-2')}}'
snowflake-role: ACCOUNTADMIN
snowflake-user: GITHUB_INTEGRATION_ADMIN_USER
snowflake-warehouse: {{env_var('SF_ENV','DEV')}}_ADMIN_XS_WH
snowflake-database: {{env_var('SF_ENV','DEV')}}_METADATA