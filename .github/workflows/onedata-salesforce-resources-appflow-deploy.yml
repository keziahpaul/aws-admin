name: Salesforce-Appflow-Deployment ( must run after Salesforce-Connector-Deployment)
on:
  push:
    branches:
      - feature/DD*
      - develop
    paths:
      - 'cloudformation/parameters/resources-dev/onedata-salesforce-resources/*ingress_flow_params.json'
      - 'cloudformation/parameters/resources-tst/onedata-salesforce-resources/*ingress_flow_params.json'
      - 'cloudformation/templates/onedata-salesforce-resources/ingress_flow.yml'
      - '.github/workflows/onedata-salesforce-resources-appflow-deploy.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'cloudformation/parameters/resources-pst/onedata-salesforce-resources/*ingress_flow_params.json'
      - 'cloudformation/parameters/resources-prd/onedata-salesforce-resources/*ingress_flow_params.json'
      - 'cloudformation/templates/onedata-salesforce-resources/ingress_flow.yml'
      - '.github/workflows/onedata-salesforce-resources-appflow-deploy.yml'

# =========================================================
# GitHub Permissions for the entire workflow
permissions:
  id-token: write
  contents: read

# =========================================================
# Jobs
jobs:
  # construct the matrix of salesforce appflow resources
  generate-rules-matrix:
    name: Generate Rules Matrix
    runs-on: [build]
    outputs:
      dev-matrix: ${{ steps.set-dev-matrix.outputs.matrix }}
      tst-matrix: ${{ steps.set-tst-matrix.outputs.matrix }}
      pst-matrix: ${{ steps.set-pst-matrix.outputs.matrix }}
      prd-matrix: ${{ steps.set-prd-matrix.outputs.matrix }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # Dynamically generate deployment matrices for dev and tst environments by scanning parameter files
      # Example output of the dynamically generated matrix:
      # [
      #   {"name": "account", "formatted_name": "account", "param_file": "account_ingress_flow_params.json"},
      #   {"name": "contact", "formatted_name": "contact", "param_file": "contact_ingress_flow_params.json"},
      #   {"name": "digital_certificate__c", "formatted_name": "digital-certificate-c", "param_file": "digital_certificate__c_ingress_flow_params.json"}
      # ]
      - name: Generate Dev Matrix
        id: set-dev-matrix
        run: |
          echo "matrix=$(find cloudformation/parameters/resources-dev/onedata-salesforce-resources -name '*_ingress_flow_params.json' -print | sed -e 's%^.*/\(.*\)_ingress_flow_params.json$%\1%' | jq -cRs '[split("\n")[] | select(length>0) | {"name": ., "formatted_name": (.|sub("_+"; "-"; "g")), "param_file": (. + "_ingress_flow_params.json")}]')" >> $GITHUB_OUTPUT

      - name: Generate TST Matrix
        id: set-tst-matrix
        run: |
          echo "matrix=$(find cloudformation/parameters/resources-tst/onedata-salesforce-resources -name '*_ingress_flow_params.json' -print | sed -e 's%^.*/\(.*\)_ingress_flow_params.json$%\1%' | jq -cRs '[split("\n")[] | select(length>0) | {"name": ., "formatted_name": (.|sub("_+"; "-"; "g")), "param_file": (. + "_ingress_flow_params.json")}]')" >> $GITHUB_OUTPUT

      - name: Generate PST Matrix
        id: set-pst-matrix
        run: |
          echo "matrix=$(find cloudformation/parameters/resources-pst/onedata-salesforce-resources -name '*_ingress_flow_params.json' -print | sed -e 's%^.*/\(.*\)_ingress_flow_params.json$%\1%' | jq -cRs '[split("\n")[] | select(length>0) | {"name": ., "formatted_name": (.|sub("_+"; "-"; "g")), "param_file": (. + "_ingress_flow_params.json")}]')" >> $GITHUB_OUTPUT

      - name: Generate PRD Matrix
        id: set-prd-matrix
        run: |
          echo "matrix=$(find cloudformation/parameters/resources-prd/onedata-salesforce-resources -name '*_ingress_flow_params.json' -print | sed -e 's%^.*/\(.*\)_ingress_flow_params.json$%\1%' | jq -cRs '[split("\n")[] | select(length>0) | {"name": ., "formatted_name": (.|sub("_+"; "-"; "g")), "param_file": (. + "_ingress_flow_params.json")}]')" >> $GITHUB_OUTPUT


  salesforce-appflow-deploy-dev:
    name: Dev-Deploy-AppFlow
    if: startsWith(github.ref ,'refs/heads/feature/DD') && github.event_name == 'push'
    needs: generate-rules-matrix
    runs-on: [non-prod, deploy]
    environment: dev
    strategy:
      matrix:
        tables: ${{ fromJson(needs.generate-rules-matrix.outputs.dev-matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::042775015153:role/GitHubRunnerSalesforceAppFlowRole
          role-duration-seconds: 900
          role-skip-session-tagging: true
          aws-region: ap-southeast-2

      - name: Parse Parameters for ${{ matrix.tables.name }}
        id: parse-parameters
        uses: ./.github/actions/parse-parameters
        with:
          parameters: cloudformation/parameters/resources-dev/onedata-salesforce-resources/${{ matrix.tables.param_file }}
          data-string: '{ "stack_name_suffix": "readonly-dev" }'

      - name: Deploy CloudFormation ${{ matrix.tables.name }} Appflow Stack
        uses: ./.github/actions/deploy-stack
        with:
          stack-name: onedata-appflow-${{ matrix.tables.formatted_name }}-flow-dev
          template: cloudformation/templates/onedata-salesforce-resources/ingress_flow.yml
          parameters: file:///${{ github.workspace }}/${{ steps.parse-parameters.outputs.output-file }}
          no-execute-changeset: false


  salesforce-appflow-deploy-tst:
    name: TST-Deploy-AppFlow
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: generate-rules-matrix
    runs-on: [non-prod, deploy]
    environment: tst
    strategy:
      matrix:
        tables: ${{ fromJson(needs.generate-rules-matrix.outputs.tst-matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::042775015153:role/GitHubRunnerSalesforceAppFlowRole
          role-duration-seconds: 900
          role-skip-session-tagging: true
          aws-region: ap-southeast-2

      - name: Parse Parameters for ${{ matrix.tables.name }}
        id: parse-parameters
        uses: ./.github/actions/parse-parameters
        with:
          parameters: cloudformation/parameters/resources-tst/onedata-salesforce-resources/${{ matrix.tables.param_file }}
          data-string: '{ "stack_name_suffix": "readonly-tst" }'

      - name: Deploy CloudFormation ${{ matrix.tables.name }} Appflow Stack
        uses: ./.github/actions/deploy-stack
        with:
          stack-name: onedata-appflow-${{ matrix.tables.formatted_name }}-flow-tst
          template: cloudformation/templates/onedata-salesforce-resources/ingress_flow.yml
          parameters: file:///${{ github.workspace }}/${{ steps.parse-parameters.outputs.output-file }}
          no-execute-changeset: false

  salesforce-appflow-deploy-pst:
    name: PST-Deploy-AppFlow
    if: (startsWith(github.event.pull_request.head.ref, 'release/'))
    needs: generate-rules-matrix
    runs-on: [prod, deploy]
    environment: pst
    strategy:
      matrix:
        tables: ${{ fromJson(needs.generate-rules-matrix.outputs.pst-matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::725563543552:role/GitHubRunnerSalesforceAppFlowRole
          role-duration-seconds: 900
          role-skip-session-tagging: true
          aws-region: ap-southeast-2

      - name: Parse Parameters for ${{ matrix.tables.name }} 
        id: parse-parameters
        uses: ./.github/actions/parse-parameters
        with:
          parameters: cloudformation/parameters/resources-pst/onedata-salesforce-resources/${{ matrix.tables.param_file }}
          data-string: '{ "stack_name_suffix": "readonly-pst" }'

      - name: Deploy CloudFormation ${{ matrix.tables.name }} Appflow Stack
        uses: ./.github/actions/deploy-stack
        with:
          stack-name: onedata-appflow-${{ matrix.tables.formatted_name }}-flow-pst
          template: cloudformation/templates/onedata-salesforce-resources/ingress_flow.yml
          parameters: file:///${{ github.workspace }}/${{ steps.parse-parameters.outputs.output-file }}
          no-execute-changeset: false

  salesforce-appflow-deploy-prd:
    name: PRD-Deploy-AppFlow
    if: (startsWith(github.event.pull_request.head.ref, 'release/'))
    needs: [generate-rules-matrix, salesforce-appflow-deploy-pst]
    runs-on: [prod, deploy]
    environment: prd
    strategy:
      matrix:
        tables: ${{ fromJson(needs.generate-rules-matrix.outputs.prd-matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::725563543552:role/GitHubRunnerSalesforceAppFlowRole
          role-duration-seconds: 900
          role-skip-session-tagging: true
          aws-region: ap-southeast-2

      - name: Parse Parameters for ${{ matrix.tables.name }}
        id: parse-parameters
        uses: ./.github/actions/parse-parameters
        with:
          parameters: cloudformation/parameters/resources-prd/onedata-salesforce-resources/${{ matrix.tables.param_file }}
          data-string: '{ "stack_name_suffix": "readonly-prd" }'

      - name: Deploy CloudFormation ${{ matrix.tables.name }} Appflow Stack
        uses: ./.github/actions/deploy-stack
        with:
          stack-name: onedata-appflow-${{ matrix.tables.formatted_name }}-flow-prd
          template: cloudformation/templates/onedata-salesforce-resources/ingress_flow.yml
          parameters: file:///${{ github.workspace }}/${{ steps.parse-parameters.outputs.output-file }}
          no-execute-changeset: false