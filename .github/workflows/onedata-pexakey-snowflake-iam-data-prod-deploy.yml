name: PROD-Deploy-Role-onedata-pexakey-exchg-snowflake-role-deploy [Data-Prod] ( should run after Deploy-onedata-pexakey-resources-data)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/onedata-pexakey-snowflake-iam-data-prod-deploy.yml'
      - 'cloudformation/templates/snowflake_iam_data.yml'

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout


jobs:
 
  pst-onedata-pexakey-exchg-snowflake-role-deploy:
    name: PST - Onedata pexakey exchg snowflake role deploy
    if: (startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: [prod, deploy] 
    environment: pst
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
          ls -lrt
          Environment='pst'
          StackName='snowflake_iam_data'
          Stack='snowflake-iam-data'
          Parameter=./cloudformation/parameters/resources-${Environment}/onedata-pexakey-resources/onedata-pexakey-${StackName}.properties

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo "Stack=$Stack" >> $GITHUB_OUTPUT
          echo "Parameter=$Parameter" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "

      - name: deploy-onedata-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "onedata-pexakey-${{ steps.get-parameter.outputs.Stack }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: ${{ steps.get-parameter.outputs.Parameter }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"
  
  prd-onedata-pexakey-exchg-snowflake-role-deploy:
    name: PRD - Onedata pexakey exchg snowflake role deploy
    if: (startsWith(github.event.pull_request.head.ref, 'release/'))
    needs: [pst-onedata-pexakey-exchg-snowflake-role-deploy]
    runs-on: [prod, deploy] 
    environment: prd
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
          ls -lrt
          Environment='prd'
          StackName='snowflake_iam_data'
          Stack='snowflake-iam-data'
          Parameter=./cloudformation/parameters/resources-${Environment}/onedata-pexakey-resources/onedata-pexakey-${StackName}.properties

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo "Stack=$Stack" >> $GITHUB_OUTPUT
          echo "Parameter=$Parameter" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "

      - name: deploy-onedata-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "onedata-pexakey-${{ steps.get-parameter.outputs.Stack }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: ${{ steps.get-parameter.outputs.Parameter }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"