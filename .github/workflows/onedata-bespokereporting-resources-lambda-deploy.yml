name: Deploy onedata bespoke reporting lambda resources
on:
  push:
    branches:
      - feature/DD-*
      - develop

    paths:
      - 'cloudformation/parameters/resources-dev/onedata-bespokereporting-resources-lambda.properties'
      - 'cloudformation/parameters/resources-tst/onedata-bespokereporting-resources-lambda.properties'
      - '.github/workflows/onedata-bespokereporting-resources-lambda-deploy.yml'
      - 'cloudformation/templates/onedata-bespokereporting-resources/onedata-bespokereporting-resources-lambda.yml'
      - 'lambda/bespoke_report_extract_lambda.py'
      - 'lambda/requirements.txt'
      - '.github/actions/zip-upload-to-s3/action.yml'
      - '.github/actions/retire-s3-objects/action.yml'


  pull_request:
    branches:
      - main
    paths:
      - 'cloudformation/parameters/resources-pst/onedata-bespokereporting-resources-lambda.properties'
      - 'cloudformation/parameters/resources-prd/onedata-bespokereporting-resources-lambda.properties'
      - '.github/workflows/onedata-bespokereporting-resources-lambda-deploy.yml'
      - 'cloudformation/templates/onedata-bespokereporting-resources/onedata-bespokereporting-resources-lambda.yml'
      - 'lambda/bespoke_report_extract_lambda.py'
      - 'lambda/requirements.txt'
      - '.github/actions/zip-upload-to-s3/action.yml'
      - '.github/actions/retire-s3-objects/action.yml'

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

env:
  Resources: onedata-bespokereporting-resources
  StackName: onedata-bespokereporting-resources-lambda

jobs:
  deploy-onedata-bespokereporting-resources-lambda-dev:
    name: deploy-onedata-bespokereporting-resources-lambda-dev
    if: startsWith(github.ref ,'refs/heads/feature/DD') && github.event_name == 'push'
    runs-on: [non-prod, deploy]
    env:
      Environment: dev
      Account: ${{ secrets.PEXA_DATA_NON_PROD_ACCOUNT }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Assume AWS Role
        uses: ./.github/actions/assume-aws-role
        with:
          Account: ${{ env.Account }}

      - name: Zip and Upload lambda and layer to s3
        id: buildzip
        uses: ./.github/actions/zip-upload-to-s3
        with:
          s3_util_shared_bucket: onedata-utility-shared-${{ env.Environment }}-${{ env.Account }}

      - name: deploy-onedata-bespoke-lambda-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.StackName }}-${{ env.Environment }}"
          template: "cloudformation/templates/${{ env.Resources }}/${{ env.StackName }}.yml"
          Environment: ${{ env.Environment }}
          ParameterPath: ./cloudformation/parameters/resources-${{ env.Environment }}/${{ env.StackName }}.properties
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

      - name: Retire old Lambda zip files
        uses: ./.github/actions/retire-s3-objects
        with:
          s3_util_shared_bucket: onedata-utility-shared-${{ env.Environment }}-${{ env.Account }}
          CurrentLambda: ${{ steps.buildzip.outputs.lambda_zip }}

  deploy-onedata-bespokereporting-resources-lambda-tst:
    name: deploy-onedata-bespokereporting-resources-lambda-tst
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: [non-prod, deploy]
    env:
      Environment: tst
      Account: ${{ secrets.PEXA_DATA_NON_PROD_ACCOUNT }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Assume AWS Role
        uses: ./.github/actions/assume-aws-role
        with:
          Account: ${{ env.Account }}

      - name: Zip and Upload lambda to s3
        id: buildzip
        uses: ./.github/actions/zip-upload-to-s3
        with:
          s3_util_shared_bucket: onedata-utility-shared-${{ env.Environment }}-${{ env.Account }}

      - name: deploy-onedata-bespoke-lambda-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.StackName }}-${{ env.Environment }}"
          template: "cloudformation/templates/${{ env.Resources }}/${{ env.StackName }}.yml"
          Environment: ${{ env.Environment }}
          ParameterPath: ./cloudformation/parameters/resources-${{ env.Environment }}/${{ env.StackName }}.properties
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

      - name: Retire old Lambda zip files
        uses: ./.github/actions/retire-s3-objects
        with:
          s3_util_shared_bucket: onedata-utility-shared-${{ env.Environment }}-${{ env.Account }}
          CurrentLambda: ${{ steps.buildzip.outputs.lambda_zip }}

  deploy-onedata-bespokereporting-resources-lambda-pst:
    name: deploy-onedata-bespokereporting-resources-lambda-pst
    if: startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: [prod, deploy]
    environment: pst
    env:
      Environment: pst
      Account: ${{ secrets.PEXA_DATA_PROD_ACCOUNT }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Assume AWS Role
        uses: ./.github/actions/assume-aws-role
        with:
          Account: ${{ env.Account }}

      - name: Zip and Upload lambda to s3
        id: buildzip
        uses: ./.github/actions/zip-upload-to-s3
        with:
          s3_util_shared_bucket: onedata-utility-shared-${{ env.Environment }}-${{ env.Account }}

      - name: deploy-onedata-bespoke-lambda-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.StackName }}-${{ env.Environment }}"
          template: "cloudformation/templates/${{ env.Resources }}/${{ env.StackName }}.yml"
          Environment: ${{ env.Environment }}
          ParameterPath: ./cloudformation/parameters/resources-${{ env.Environment }}/${{ env.StackName }}.properties
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

      - name: Retire old Lambda zip files
        uses: ./.github/actions/retire-s3-objects
        with:
          s3_util_shared_bucket: onedata-utility-shared-${{ env.Environment }}-${{ env.Account }}
          CurrentLambda: ${{ steps.buildzip.outputs.lambda_zip }}

  deploy-onedata-bespokereporting-resources-lambda-prd:
    name: deploy-onedata-bespokereporting-resources-lambda-prd
    if: startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: [prod, deploy]
    needs: [deploy-onedata-bespokereporting-resources-lambda-pst]
    environment: prd
    env:
      Environment: prd
      Account: ${{ secrets.PEXA_DATA_PROD_ACCOUNT }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Assume AWS Role
        uses: ./.github/actions/assume-aws-role
        with:
          Account: ${{ env.Account }}

      - name: Zip and Upload lambda to s3
        id: buildzip
        uses: ./.github/actions/zip-upload-to-s3
        with:
          s3_util_shared_bucket: onedata-utility-shared-${{ env.Environment }}-${{ env.Account }}

      - name: deploy-onedata-bespoke-lambda-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.StackName }}-${{ env.Environment }}"
          template: "cloudformation/templates/${{ env.Resources }}/${{ env.StackName }}.yml"
          Environment: ${{ env.Environment }}
          ParameterPath: ./cloudformation/parameters/resources-${{ env.Environment }}/${{ env.StackName }}.properties
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

      - name: Retire old Lambda zip files
        uses: ./.github/actions/retire-s3-objects
        with:
          s3_util_shared_bucket: onedata-utility-shared-${{ env.Environment }}-${{ env.Account }}
          CurrentLambda: ${{ steps.buildzip.outputs.lambda_zip }}
