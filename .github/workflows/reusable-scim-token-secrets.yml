name: Reusable SCIM Token Secrets Deployment

on:
  workflow_call:
    inputs:
      aws-account-name:
        description: 'AWS Account Name'
        required: true
        type: string
      runner-type:
        description: 'Runner type (non-prod or prod)'
        required: true
        type: string
      terragrunt-path:
        description: 'Path to terragrunt configuration'
        required: true
        type: string
      aws-account:
        description: 'AWS Account ID'
        required: true
        type: string
      no-execute-changeset:
        description: 'Do NOT Execute (dry run mode)'
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy SCIM Token Secrets
    runs-on: ['${{ inputs.runner-type }}', 'deploy']
    container:
      image: '004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/apim-kong-provisioning:latest'
      volumes:
        - /home/github/.ssh/runner_ssh:/root/.ssh/id_rsa
        - /home/github/.ssh/known_hosts:/root/.ssh/known_hosts
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
      status: ${{ steps.status.outputs.result }}
    steps:
      - name: 📋 Deployment Information
        run: |
          echo "## 🚀 SCIM Token Secrets Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **AWS Account** | ${{ inputs.aws-account-name }} (${{ inputs.aws-account }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Terragrunt Path** | ${{ inputs.terragrunt-path }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runner Type** | ${{ inputs.runner-type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry Run** | ${{ inputs.no-execute-changeset }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tool** | Terragrunt |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account }}:role/GitHubRunnerPEXAOneDataRole
          role-duration-seconds: 900
          role-skip-session-tagging: true
          aws-region: ap-southeast-2

      - name: 🔧 Terragrunt Version
        id: version
        run: |
          terragrunt --version
          terraform version

      - name: 🏗️ Terragrunt Init
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "🚀 Initializing Terragrunt in: ${{ inputs.terragrunt-path }}"
          terragrunt init

      - name: 📋 Terragrunt Plan
        id: plan
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "Planning deployment with Terragrunt"
          set +e
          terragrunt plan -detailed-exitcode -out=tfplan
          
          PLAN_EXIT_CODE=$?
          echo "exitcode=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT
          
          case $PLAN_EXIT_CODE in
            0)
              echo "✅ No changes needed"
              echo "plan-status=no-changes" >> $GITHUB_OUTPUT
              ;;
            1)
              echo "❌ Terragrunt plan failed"
              echo "plan-status=failed" >> $GITHUB_OUTPUT
              exit 1
              ;;
            2)
              echo "📝 Changes detected"
              echo "plan-status=changes-detected" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❓ Unknown exit code: $PLAN_EXIT_CODE"
              echo "plan-status=unknown" >> $GITHUB_OUTPUT
              exit 1
              ;;
          esac

      - name: 📊 Determine Status
        id: status
        if: always()
        shell: bash
        run: |
          echo "result=${{ steps.plan.outputs.plan-status }}" >> $GITHUB_OUTPUT

      - name: 📊 Plan Summary
        run: |
          echo "## 📊 Terragrunt Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          case "${{ steps.status.outputs.result }}" in
            "no-changes")
              echo "✅ **Plan Status:** No changes detected" >> $GITHUB_STEP_SUMMARY
              ;;
            "changes-detected")
              echo "📝 **Plan Status:** Changes detected and planned" >> $GITHUB_STEP_SUMMARY
              ;;
            "failed")
              echo "❌ **Plan Status:** Plan failed" >> $GITHUB_STEP_SUMMARY
              ;;
          esac

      - name: 🚀 Terragrunt Apply
        if: steps.status.outputs.result == 'changes-detected' && inputs.no-execute-changeset == false
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "🚀 Applying SCIM Token Secrets changes..."
          terragrunt apply tfplan

      - name: 🔍 Terragrunt Output
        if: steps.status.outputs.result == 'changes-detected' || steps.status.outputs.result == 'no-changes'
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "📤 SCIM Token Secrets Outputs:"
          terragrunt output

      - name: ✅ Deployment Success
        if: steps.status.outputs.result != 'failed' && inputs.no-execute-changeset == false
        run: |
          echo "## ✅ SCIM Token Secrets Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SCIM Token Secrets infrastructure has been successfully deployed to **${{ inputs.aws-account-name }}** account." >> $GITHUB_STEP_SUMMARY

      - name: 🔍 Dry Run Summary
        if: inputs.no-execute-changeset == true
        run: |
          echo "## 🔍 Dry Run Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This was a dry run. No changes were applied to the infrastructure." >> $GITHUB_STEP_SUMMARY
          echo "Review the plan output above to see what would be changed." >> $GITHUB_STEP_SUMMARY

      - name: ❌ Handle Failure
        if: steps.status.outputs.result == 'failed'
        run: |
          echo "## ❌ SCIM Token Secrets Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The SCIM Token Secrets deployment failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          exit 1
