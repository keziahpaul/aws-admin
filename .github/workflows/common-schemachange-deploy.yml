## The action file gets following input in the action #################################################################################################
## 1. Account:      new options can be entered,
##                  make sure they are no space or special characters, must easily be able to identify the snowflake Account
## 2. Environment:  The standard environments dev, tst, prf, pst, prd.
##                  These are such that they can be used as prefix for the respective generic user names in the respective snowflake environments, eg: dev_alation_user
## To add a new account, please do following changes:
## 1. Update inputs->account->options, add the account_name you want in the option section for account input
## 2. Make an entry in the environment json variable "accountName" in the format "<option_added>-<environment>": "Accountname" seperated by comma . eg: ,"exchange-dev":"QN78122"
##    Note: make sure the key part is always same as options for account, and environment Inputs seperated by hiphen '-'. Eg: "exchange-dev", since the input is cpmared to teh json variable
##########################################################################################################################################################
name: COMMON SCHEMACHANGE DEPLOY
on:
  workflow_dispatch:
    branches:
      - main
    inputs:

      account:
        type: choice
        description: Select snowflake account
        default: landinsights

        options:
        - sandbox
        - exchange
        - landinsights
        - value-australia
        - group
        - group-azure
        - px
        - aml


      environment:
        type: choice
        description: Select snowflake environment
        default: dev
        options:
        - dev
        - tst
        - pst
        - perf
        - prd


permissions:
  id-token: write
  contents: write

env:

  accountName: '{"exchange-dev": "QN78122", "exchange-tst": "QN78122","exchange-pst": "ZZ82647", "exchange-prd": "ZZ82647"
                  , "landinsights-dev" : "WY17498", "landinsights-tst" : "WY17498", "landinsights-pst" : "US08173", "landinsights-prd" : "US08173"
                  , "value-australia-dev" : "HP89999", "value-australia-tst" : "HP89999", "value-australia-pst" : "VO84682", "value-australia-prd" : "VO84682"
                  , "group-dev": "DJ58410",  "group-tst": "DJ58410", "group-pst": "JV60414", "group-prd": "JV60414"
                  , "group-azure-dev": "EH91822", "group-azure-tst": "EH91822", "group-azure-pst": "EN45970" ,  "group-azure-prd": "EN45970" 
                  , "px-dev": "OW01050","px-tst": "OW01050", "px-pst": "DN17764", "px-prd": "DN17764"
                  , "aml-dev": "RK78474","aml-tst": "RK78474", "aml-pst": "OL48224", "aml-prd": "OL48224"}'
  ROLE_TO_ASSUME: arn:aws:iam::004761221582:role/GitHubRunnerPEXAOneDataBuildRole
  ECR_REPOSITORY: pexa-one-data-snowflake-au-common-lib
  IMAGE: 004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/pexa-one-data-snowflake-au-common-lib:latest_prod
  dev_pdg_aws_account_number: '${{ vars.PDG_DEV_AWS_ACCOUNT_NUMBER }}'
  tst_pdg_aws_account_number: '${{ vars.PDG_TST_AWS_ACCOUNT_NUMBER }}'
  pst_pdg_aws_account_number: '${{ vars.PDG_PST_AWS_ACCOUNT_NUMBER }}'
  prd_pdg_aws_account_number: '${{ vars.PDG_PRD_AWS_ACCOUNT_NUMBER }}'
  dev_exchange_core_aws_account_number: '${{ vars.EXCHANGE_CORE_NONPROD_AWS_ACCOUNT_NUMBER }}'
  tst_exchange_core_aws_account_number: '${{ vars.EXCHANGE_CORE_NONPROD_AWS_ACCOUNT_NUMBER }}'
  pst_exchange_core_aws_account_number: '${{ vars.EXCHANGE_CORE_NONPROD_AWS_ACCOUNT_NUMBER }}'
  prd_exchange_core_aws_account_number: '${{ vars.EXCHANGE_CORE_PRD_AWS_ACCOUNT_NUMBER }}'
  dev_exchange_core_aws_s3_bucket: '${{ vars.EXCHANGE_CORE_DEV_S3_BUCKET }}'
  tst_exchange_core_aws_s3_bucket: '${{ vars.EXCHANGE_CORE_TST_S3_BUCKET }}'
  pst_exchange_core_aws_s3_bucket: '${{ vars.EXCHANGE_CORE_PST_S3_BUCKET }}'
  prd_exchange_core_aws_s3_bucket: '${{ vars.EXCHANGE_CORE_PRD_S3_BUCKET }}'
  dev_pexakey_rds_nlp_name: '${{ vars.DEV_PEXAKEY_RDS_NLP_NAME }}'
  tst_pexakey_rds_nlp_name: '${{ vars.TST_PEXAKEY_RDS_NLP_NAME }}'
  pst_pexakey_rds_nlp_name: '${{ vars.PST_PEXAKEY_RDS_NLP_NAME }}'
  prd_pexakey_rds_nlp_name: '${{ vars.PRD_PEXAKEY_RDS_NLP_NAME }}'

  exchange_statement_timeout_at: '${{ vars.EXCHANGE_STATEMENT_TIMEOUT_AT }}'
  landinsights_statement_timeout_at: '${{ vars.LANDINSIGHTS_STATEMENT_TIMEOUT_AT }}'
  value-australia_statement_timeout_at: '${{ vars.VALUE_AUSTRALIA_STATEMENT_TIMEOUT_AT }}'
  group_statement_timeout_at: '${{ vars.GROUP_STATEMENT_TIMEOUT_AT }}'
  px_statement_timeout_at: '${{ vars.PX_STATEMENT_TIMEOUT_AT }}'

jobs:
  get_Account_Name_Detail:
    name: get Account Name based on Inputs
    runs-on: [prod, deploy]
    outputs:
      run_rest_jobs: ${{ steps.get_Account_Name.outputs.run_rest_jobs }}
      accName: ${{ steps.get_Account_Name.outputs.accName }}
      deploy_environment: ${{ steps.get_Account_Name.outputs.deploy_environment }}
      acc_input: ${{ steps.get_Account_Name.outputs.acc_input }}
      env_input: ${{ steps.get_Account_Name.outputs.env_input }}
      image: ${{ steps.get_Account_Name.outputs.image }}
      aws_secret_account: ${{ steps.get_Account_Name.outputs.aws_secret_account }}
      aws_logging_account: ${{  steps.get_Account_Name.outputs.aws_logging_account }}
      aws_logging_aws_role: ${{  steps.get_Account_Name.outputs.aws_logging_aws_role }}
      aws_logging_aws_kms_key: ${{  steps.get_Account_Name.outputs.aws_logging_aws_kms_key }}
      in_aws_account_1: ${{ steps.get_Account_Name.outputs.in_aws_account_1 }}
      in_aws_s3_bucket: ${{ steps.get_Account_Name.outputs.in_aws_s3_bucket }}
      snowflake_acc_region: ${{ steps.get_Account_Name.outputs.snowflake_acc_region }}
      in_pexakey_rds_nlp_name: ${{ steps.get_Account_Name.outputs.in_pexakey_rds_nlp_name }}
      in_statement_timeout_at: ${{steps.get_Account_Name.outputs.in_statement_timeout_at}}

    steps:
      - name: Checkout actions
        uses: actions/checkout@v7

      - name: Get Account Details
        id: get_Account_Name
        uses: ./.github/actions/getAccountDetails
        with:
          ACC_INPUT: ${{ github.event.inputs.account  }}
          ENV_INPUT: ${{ github.event.inputs.environment  }}
          ACCNAME: ${{ env.accountName }}
          PROD_AWS_ACCOUNT: '${{ vars.PROD_PEXAONEDATA_AWS_ACCOUNT }}'
          PROD_SECOPS_AWS_ACCOUNT: '${{ vars.PROD_SECOPS_AWS_ACCOUNT }}'
          PROD_LOGGING_AWS_KMS_KEY: '${{ vars.PROD_LOGGING_KMS_KEY_ID }}'
          PROD_LOGGING_AWS_ROLE: '${{ vars.PROD_AWS_IAM_ROLE_LOGGING }}'
          NONPROD_LOGGING_AWS_KMS_KEY: '${{ vars.NONPROD_LOGGING_KMS_KEY_ID }}'
          NONPROD_LOGGING_AWS_ROLE: '${{ vars.NONPROD_AWS_IAM_ROLE_LOGGING }}'
          NONPROD_AWS_ACCOUNT: '${{ vars.NONPROD_PEXAONEDATA_AWS_ACCOUNT }}'
          PDG_AWS_ACCOUNT_NUMBER: ${{ env[format('{0}_pdg_aws_account_number', github.event.inputs.environment )] }}
          EXCHANGE_CORE_AWS_ACCOUNT_NUMBER: ${{ env[format('{0}_exchange_core_aws_account_number', github.event.inputs.environment )] }}
          EXCHANGE_AWS_CORE_BUCKET: ${{ env[format('{0}_exchange_core_aws_s3_bucket', github.event.inputs.environment )] }}
          PEXAKEY_RDS_NLP_NAME: ${{ env[format('{0}_pexakey_rds_nlp_name', github.event.inputs.environment )] }}
          STATEMENT_TIMEOUT_AT: ${{ env[format('{0}_statement_timeout_at', github.event.inputs.account )] }}

  common-schemachange-deploy:
    if:  needs.get_Account_Name_Detail.outputs.run_rest_jobs  == 'true'
    name: Common Schemachange deploy
    runs-on: [prod, deploy]
    needs: [get_Account_Name_Detail]
    container:
      image: ${{ needs.get_Account_Name_Detail.outputs.image }}
    env:
      environment: ${{ needs.get_Account_Name_Detail.outputs.env_input }}
      account: ${{ needs.get_Account_Name_Detail.outputs.acc_input }}
      accName: ${{ needs.get_Account_Name_Detail.outputs.accName }}
      deploy_environment: ${{ needs.get_Account_Name_Detail.outputs.deploy_environment }}
      aws_secret_account: ${{ needs.get_Account_Name_Detail.outputs.aws_secret_account }}
      aws_logging_account: ${{ needs.get_Account_Name_Detail.outputs.aws_logging_account }}
      aws_logging_aws_role: ${{ needs.get_Account_Name_Detail.outputs.aws_logging_aws_role }}
      aws_logging_aws_kms_key: ${{ needs.get_Account_Name_Detail.outputs.aws_logging_aws_kms_key }}
      in_aws_account_1: ${{ needs.get_Account_Name_Detail.outputs.in_aws_account_1 }}
      in_aws_s3_bucket: ${{ needs.get_Account_Name_Detail.outputs.in_aws_s3_bucket }}
      SNOWFLAKE_PRIVATE_KEY_PATH: github_integration_user_private_key.p8
      snowflake_acc_region: ${{ needs.get_Account_Name_Detail.outputs.snowflake_acc_region }}
      in_statement_timeout_at: ${{ needs.get_Account_Name_Detail.outputs.in_statement_timeout_at }}
      in_pexakey_rds_nlp_name: ${{ needs.get_Account_Name_Detail.outputs.in_pexakey_rds_nlp_name }}
      
    steps:
      - name: Assume Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::${{ env.aws_secret_account }}:role/GitHubRunnerPEXAOneDataRole
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: copy Account specific code
        run: |
          if [ -d AccountScripts/${{ env.account }} ]; then
            echo "Account Specific scripts for ${{ env.account }}  exists and will be moved to schemachange/scripts"
            ls -R AccountScripts/${{ env.account }}/*
            cp -r AccountScripts/${{ env.account }}/* schemachange/scripts
          else
            echo "DO NOT have Account Specific scripts"
          fi

      - name: Fetch secrets
        id: fetch-secrets
        shell: bash
        run: |

          elements=("dbt" "github" "alation" "tableau" "sagemaker" "ssa_dbt" "glue" "bigid")
          SECRETS=$(aws secretsmanager list-secrets --query "SecretList[?starts_with(Name, 'onedata')].Name" --output text)
          if [[ "${{ env.environment }}" == "pst" ]]; then
            deploy_env="pre-prod"
          else
            deploy_env=${{ env.deploy_environment }}
          fi
          for element in "${elements[@]}"; do
            for secret_in_aws in $SECRETS; do
              if [[ "onedata_${deploy_env}_${{ env.environment }}_${{ env.account  }}_snowflake-$element-user-public-key" == "$secret_in_aws" ]]; then
                SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id onedata_${deploy_env}_${{ env.environment }}_${{ env.account  }}_snowflake-$element-user-public-key --query 'SecretString' --output text)
                the_secret=${SECRET_VALUE//$'\n'/ }
                echo "::add-mask::$the_secret"
                echo "SNOWFLAKE_${element^^}_PUBLIC_KEY=$the_secret" >> $GITHUB_ENV
                echo "SNOWFLAKE_${element^^}_PUBLIC_KEY"

              fi
            done
          done

      - name: Fetch Snowflake Creds
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SNOWFLAKE_PRIVATE_KEY,onedata_${{ env.deploy_environment }}_${{ env.account  }}_snowflake-github-admin-user-private-key
            SNOWFLAKE_PRIVATE_KEY_PASSPHRASE,onedata_${{ env.deploy_environment }}_${{ env.account  }}_snowflake-github-admin-user-passphrase
            ,onedata_${{ env.deploy_environment }}_${{ env.environment  }}_exchange_snowflake_pexakey_rds_credentials
            ,onedata_${{ env.deploy_environment }}_${{ env.environment  }}_exchange_snowflake_push_not_rds_credentials
          parse-json-secrets: true

      - name: Dry Run
        run: |
          echo '${{ env.in_pexakey_rds_nlp_name }}'
          echo '${{ env.SNOWFLAKE_PRIVATE_KEY }}' >> github_integration_user_private_key.p8
          chmod 600 github_integration_user_private_key.p8

          make common_dry_run SF_ENV=${{ env.environment  }} ACCOUNT_NAME=${{ env.accName }} AWS_LOGGING_ACCOUNT=${{ env.aws_logging_account }} AWS_LOGGING_ROLE=${{ env.aws_logging_aws_role }} AWS_LOGGING_KMS_KEY=${{ env.aws_logging_aws_kms_key }} SF_ACCOUNT_ID=${{ env.accName }} AWS_ACCOUNT_1=${{ env.in_aws_account_1 }} AWS_S3_BUCKET=${{ env.in_aws_s3_bucket }}  SNOWFLAKE_DBT_PUBLIC_KEY='${{ env.SNOWFLAKE_DBT_PUBLIC_KEY }}' SNOWFLAKE_SSA_DBT_PUBLIC_KEY='${{ env.SNOWFLAKE_SSA_DBT_PUBLIC_KEY }}' SNOWFLAKE_GITHUB_ADMIN_PUBLIC_KEY='${{ env.SNOWFLAKE_GITHUB_ADMIN_PUBLIC_KEY }}' SNOWFLAKE_GITHUB_USER_PUBLIC_KEY='${{ env.SNOWFLAKE_GITHUB_USER_PUBLIC_KEY }}' SNOWFLAKE_ALATION_USER_PUBLIC_KEY='${{ env.SNOWFLAKE_ALATION_USER_PUBLIC_KEY }}' SNOWFLAKE_TABLEAU_USER_PUBLIC_KEY='${{ env.SNOWFLAKE_TABLEAU_USER_PUBLIC_KEY }}' SNOWFLAKE_SAGEMAKER_USER_PUBLIC_KEY='${{ env.SNOWFLAKE_SAGEMAKER_USER_PUBLIC_KEY }}' SNOWFLAKE_BIGID_PUBLIC_KEY='${{ env.SNOWFLAKE_BIGID_PUBLIC_KEY }}' SF_REGION='${{ env.snowflake_acc_region }}' DATA_AWS_ACCOUNT='${{ env.aws_secret_account}}' IN_STATEMENT_TIMEOUT_AT=${{ env.in_statement_timeout_at}} PEXAKEY_RDS_USERNAME=${{ env.PEXAKEY_RDS_USERNAME }} PEXAKEY_RDS_PASSWORD='${{ env.PEXAKEY_RDS_PASSWORD }}' PEXAKEY_RDS_NLP_NAME='${{ env.in_pexakey_rds_nlp_name }}' PUSH_NOT_RDS_USERNAME=${{ env.PUSH_NOT_RDS_USERNAME }} PUSH_NOT_RDS_PASSWORD=${{ env.PUSH_NOT_RDS_PASSWORD }}


      - name: Deploy Common Schemachange
        run: |
          make common_deploy SF_ENV=${{ env.environment  }} ACCOUNT_NAME=${{ env.accName }} AWS_LOGGING_ACCOUNT=${{ env.aws_logging_account }} AWS_LOGGING_ROLE=${{ env.aws_logging_aws_role }} AWS_LOGGING_KMS_KEY=${{ env.aws_logging_aws_kms_key }} SF_ACCOUNT_ID=${{ env.accName }} AWS_ACCOUNT_1=${{ env.in_aws_account_1 }}  AWS_S3_BUCKET=${{ env.in_aws_s3_bucket }}  SNOWFLAKE_DBT_PUBLIC_KEY='${{ env.SNOWFLAKE_DBT_PUBLIC_KEY }}' SNOWFLAKE_SSA_DBT_PUBLIC_KEY='${{ env.SNOWFLAKE_SSA_DBT_PUBLIC_KEY }}' SNOWFLAKE_GITHUB_ADMIN_PUBLIC_KEY='${{ env.SNOWFLAKE_GITHUB_ADMIN_PUBLIC_KEY }}' SNOWFLAKE_GITHUB_USER_PUBLIC_KEY='${{ env.SNOWFLAKE_GITHUB_USER_PUBLIC_KEY }}' SNOWFLAKE_ALATION_USER_PUBLIC_KEY='${{ env.SNOWFLAKE_ALATION_USER_PUBLIC_KEY }}' SNOWFLAKE_TABLEAU_USER_PUBLIC_KEY='${{ env.SNOWFLAKE_TABLEAU_USER_PUBLIC_KEY }}' SNOWFLAKE_SAGEMAKER_USER_PUBLIC_KEY='${{ env.SNOWFLAKE_SAGEMAKER_USER_PUBLIC_KEY }}' SNOWFLAKE_BIGID_PUBLIC_KEY='${{ env.SNOWFLAKE_BIGID_PUBLIC_KEY }}' SF_REGION='${{ env.snowflake_acc_region }}' DATA_AWS_ACCOUNT='${{ env.aws_secret_account}}' IN_STATEMENT_TIMEOUT_AT=${{ env.in_statement_timeout_at}} PEXAKEY_RDS_USERNAME=${{ env.PEXAKEY_RDS_USERNAME }} PEXAKEY_RDS_PASSWORD='${{ env.PEXAKEY_RDS_PASSWORD }}' PEXAKEY_RDS_NLP_NAME=${{ env.in_pexakey_rds_nlp_name }} PUSH_NOT_RDS_USERNAME=${{ env.PUSH_NOT_RDS_USERNAME }} PUSH_NOT_RDS_PASSWORD=${{ env.PUSH_NOT_RDS_PASSWORD }}
