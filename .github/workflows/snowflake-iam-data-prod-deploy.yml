name: Deploy-Snowflake-IAM-Role [Data-Prod]

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snowflake-iam-data-prod-deploy.yml'
      - 'cloudformation/templates/snowflake_iam_data.yml'

jobs:
 
  data-onedata-snowflake-egress-role-deploy:
    name: Prod datanp-onedata-snowflake-egress-role-deploy
    uses: ./.github/workflows/reusable-data-snowflake-iam-deploy.yml
    with:
      S3BucketName: "pexa-salesforce-data-egress-prod"
      SnowflakePrincipalArn: "arn:aws:iam::030353805257:user/qpxc0000-s"
      SnowflakeExternalId: "JV60414_SFCRole=group_salesforce_s3_integration"
      RunnerEnvironment: "prod"
      Environment: "prd"
      AWSAccountNumber: "725563543552"
      CFTemplate: "cloudformation/templates/snowflake_iam_data.yml"
      CFStackName: "onedata-snowflake-group-egress-iam-role"
      GitHubDeployRole: "GitHubRunnerPEXAOneDataRole"
      IAMRoleName: "pexa-one-data-group-snowflake-access"
      KMSKeyResourceType: "key"
      KMSKeyResourceValue: "6aef83da-c149-4741-85d9-59df5fddf22c"