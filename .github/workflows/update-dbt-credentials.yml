## The action file gets following input in the action #################################################################################################
## 1. Account:      new options can be entered,
##                  make sure they are no space or special characters, must easily be able to identify the snowflake Account
## 2. Environment:  The standard environments dev, tst, prf, pst, prd.
##                  These are such that they can be used as prefix for the respective generic user names in the respective snowflake environments, eg: dev_alation_user
## To add a new account, please do following changes:
## 1. Update inputs->account->options, add the account_name you want in the option section for account input
## 2. Make an entry in the environment json variable "accountName" in the format "<option_added>-<environment>": "Accountname" seperated by comma . eg: ,"exchange-dev":"QN78122"
##    Note: make sure the key part is always same as options for account, and environment Inputs seperated by hiphen '-'. Eg: "exchange-dev", since the input is cpmared to teh json variable
##########################################################################################################################################################
name: UPDATE DBT CREDENTIALS 
on:
  workflow_dispatch:
    inputs:
      dbt_project:
        type: choice
        description: select dbt project
        default: onedata-au-sandbox
        options:
        - onedata-au-dbt-common-lib
        - onedata-au-sandbox
        - onedata-au-landinsights
        - onedata-au-landinsights-prod
        - onedata-au-pexa-exchange
        - onedata-au-pexa-exchange-prod
        - onedata-au-pexa-group
        - onedata-au-pexa-group-prod
        - onedata-au-value-australia
        - onedata-au-value-australia-prod
        - onedata-au-pexa-group-selfservice-analytics
        - all


      environment:
        type: choice
        description: Select environment
        default: dev
        options:
        - dev
        - tst
        - pst
        - prd
      

permissions:
  id-token: write
  contents: write

env:
  IMAGE: 004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/pexa-one-data-snowflake-au-common-lib:latest_prod

jobs:
  update-dbt-credentials:
    name: update dbt credentials
    runs-on: [prod, deploy]
    container:
      image: ${{vars.IMAGE}}
    steps:
      - name: set aws account
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.environment }}" == 'pst'  ||  "${{ github.event.inputs.environment }}" == 'prd' ]]; then
            echo aws_secret_account='${{ vars.PROD_PEXAONEDATA_AWS_ACCOUNT }}'  >> $GITHUB_ENV
          else
            echo aws_secret_account='${{ vars.NONPROD_PEXAONEDATA_AWS_ACCOUNT }}' >> $GITHUB_ENV
          fi


      - name: Assume Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::${{ env.aws_secret_account }}:role/GitHubRunnerPEXAOneDataRole
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Update Credentials
        run: python utils/update_dbt_credentials.py ${{github.event.inputs.environment}} ${{github.event.inputs.dbt_project}} ${{ secrets.DBT_API_KEY }}
