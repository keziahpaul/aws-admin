name: Reusable Snowflake IAM Role Deployment Workflow
on:
  workflow_call:
    inputs:
      S3BucketName:
        required: false
        type: string
      SnowflakePrincipalArn:
        required: false
        type: string
      SnowflakeExternalId:
        required: false
        type: string
      Environment:
        required: true
        type: string
      RunnerEnvironment:
        required: true
        type: string
      AWSAccountNumber:
        required: true
        type: string
      CFTemplate:
        required: true
        type: string
      CFStackName:
        required: true
        type: string
      GitHubDeployRole:
        required: true
        type: string
      IAMRoleName:
        required: true
        type: string
      KMSKeyResourceType:
        required: true
        type: string
      KMSKeyResourceValue:
        required: true
        type: string
     

permissions:
  id-token: write
  contents: read # Required for actions/checkout@v3

env:
  AWS_REGION: ap-southeast-2

jobs:
  validate-deploy-infra:
    name: Validate and Deploy Infra
    runs-on: [ deploy , "${{ inputs.RunnerEnvironment }}" ]
    steps:
    - name: Checkout Source
      uses: actions/checkout@v3
      with:
        ref: ${{ env.github_ref }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: arn:aws:iam::${{ inputs.AWSAccountNumber }}:role/${{ inputs.GitHubDeployRole }}
        role-duration-seconds: 900
        role-skip-session-tagging: true
        aws-region: ${{ env.AWS_REGION }}

    - name: Validate Cloudformation Template
      run: aws cloudformation validate-template --template-body file://${{ inputs.CFTemplate }}

    - name: Deploy Cloudformation Stack
      uses: PEXA-AU/aws-cloudformation-github-deploy@2.0.0
      with:
        name: ${{ inputs.CFStackName }}
        template: ${{ inputs.CFTemplate }}
        capabilities: 'CAPABILITY_NAMED_IAM'
        no-fail-on-empty-changeset: '1'
        tail-events: "1"
        event-timezone: "Australia/Melbourne"
        parameter-overrides: >-
          S3BucketName=${{ inputs.S3BucketName }},
          SnowflakePrincipalArn=${{ inputs.SnowflakePrincipalArn }},
          SnowflakeExternalId=${{ inputs.SnowflakeExternalId }},
          Environment=${{ inputs.Environment }},
          IAMRoleName=${{ inputs.IAMRoleName }},
          KMSKeyResourceType=${{ inputs.KMSKeyResourceType }},
          KMSKeyResourceValue=${{ inputs.KMSKeyResourceValue }}
