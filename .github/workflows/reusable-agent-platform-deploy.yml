name: Deploy Agent Platform [Reusable - Terragrunt]

# Workflow trigger(s)
on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        type: string
        required: true
      runner-type:
        description: 'Type of runner, choose between "prod" or "non-prod"'
        type: string
        required: true
      aws-account:
        description: 'AWS account id'
        required: true
        type: string
      terragrunt-path:
        description: 'Path to Terragrunt configuration'
        type: string
        required: true
    outputs:
      terragrunt-plan-exitcode:
        description: 'Terragrunt plan exit code'
        value: ${{ jobs.deploy-agent-platform-infra.outputs.plan-exitcode }}
      deployment-status:
        description: 'Overall deployment status'
        value: ${{ jobs.deploy-agent-platform-infra.outputs.status }}

# GitHub Permissions for the entire workflow
permissions:
  id-token: write
  contents: read

# Jobs
jobs:
  deploy-agent-platform-infra:
    name: Deploy Agent Platform Infrastructure
    runs-on: ['${{ inputs.runner-type }}', 'deploy']
    environment: ${{ inputs.environment }}
    container:
      image: '004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/apim-kong-provisioning:latest'
      volumes:
        - /home/github/.ssh/runner_ssh:/root/.ssh/id_rsa
        - /home/github/.ssh/known_hosts:/root/.ssh/known_hosts
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
      status: ${{ steps.status.outputs.result }}
    steps:
      - name: 📋 Deployment Information
        run: |
          echo "## 🚀 Agent Platform Infrastructure Deployment (Terragrunt)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **AWS Account** | ${{ inputs.aws-account }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Terragrunt Path** | ${{ inputs.terragrunt-path }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runner Type** | ${{ inputs.runner-type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tool** | Terragrunt |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 📥 Checkout Source Code
        uses: actions/checkout@v5

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account }}:role/GitHubRunnerAgentPlatformDeploymentRole
          role-duration-seconds: 900
          role-skip-session-tagging: true
          aws-region: ap-southeast-2

      - name: 🔧 Terragrunt Version
        id: version
        run: |
          terragrunt --version
          terraform version
          echo "terragrunt-version=$(terragrunt --version | head -1)" >> $GITHUB_OUTPUT
          echo "terraform-version=$(terraform version -json | jq -r '.terraform_version')" >> $GITHUB_OUTPUT

      - name: 🗄️ Bootstrap AOSS Index (if needed)
        working-directory: ${{ inputs.terragrunt-path }}
        shell: bash
        run: |
          # Agent config now lives in agents/*.hcl (see DD-6705 auto-discover
          # refactor); the old *.auto.tfvars files were removed. Discover
          # KB-enabled agents by scanning those HCL files.
          ENV="${{ inputs.environment }}"
          AGENTS_DIR="agents"

          if [[ ! -d "$AGENTS_DIR" ]]; then
            echo "No agents/ directory found, skipping AOSS bootstrap"
            exit 0
          fi

          # Collect the name of every agent whose HCL enables the KB.
          AGENTS=""
          for f in "$AGENTS_DIR"/*.hcl; do
            [[ -e "$f" ]] || continue
            if grep -Eq 'enable_kb[[:space:]]*=[[:space:]]*true' "$f"; then
              AGENT_NAME=$(grep -oP 'name\s*=\s*"\K[^"]+' "$f" | head -1)
              [[ -n "$AGENT_NAME" ]] && AGENTS="$AGENTS $AGENT_NAME"
            fi
          done
          AGENTS=$(echo "$AGENTS" | xargs)  # trim

          if [[ -z "$AGENTS" ]]; then
            echo "No KB-enabled agents found in $AGENTS_DIR, skipping AOSS bootstrap"
            exit 0
          fi

          echo "KB enabled for agents: $AGENTS - checking AOSS index..."

          # Shared collection name. project defaults to "onedata" (matches the
          # live collection onedata-<env>-agent-platform).
          PROJECT="onedata"
          COLLECTION_NAME="${PROJECT}-${ENV}-agent-platform"

          # Get collection endpoint
          ENDPOINT=$(aws opensearchserverless batch-get-collection \
            --names "$COLLECTION_NAME" \
            --region ap-southeast-2 \
            --query 'collectionDetails[0].collectionEndpoint' \
            --output text 2>/dev/null)

          if [[ "$ENDPOINT" == "None" || -z "$ENDPOINT" ]]; then
            echo "Collection '$COLLECTION_NAME' not found or not active yet - will be created by Terraform"
            exit 0
          fi

          echo "Collection endpoint: $ENDPOINT"

          # For each KB agent, ensure the index exists. Delegates to the
          # committed helper script (curl --aws-sigv4, no inline Python) so the
          # workflow YAML stays simple and there is a single source of truth for
          # the index mapping.
          SCRIPT="${GITHUB_WORKSPACE}/terraform/infrastructure/agent-platform/scripts/bootstrap-aoss-index.sh"
          chmod +x "$SCRIPT" || true

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          for AGENT in $AGENTS; do
            INDEX_NAME="${ENV}-${AGENT}-index"
            KB_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ENV}-${AGENT}-agent-bedrock-kb"
            echo "Bootstrapping index '$INDEX_NAME' (KB role: $KB_ROLE_ARN)"
            # Non-fatal: a 403 (access policy not yet propagated) or an
            # already-existing index must not fail the deploy — Terraform will
            # (re)attempt KB creation and this step re-runs idempotently.
            "$SCRIPT" "$COLLECTION_NAME" "$INDEX_NAME" "$KB_ROLE_ARN" || \
              echo "  ⚠️ Index bootstrap for '$INDEX_NAME' did not complete (continuing)"
          done

      - name: 📍 Verify Terragrunt Path
        working-directory: ${{ inputs.terragrunt-path }}
        shell: bash
        run: |
          echo "Current directory: $(pwd)"
          echo "Terragrunt config file:"
          if [[ -f "terragrunt.hcl" ]]; then
            echo "✅ terragrunt.hcl found"
            head -10 terragrunt.hcl
          else
            echo "❌ terragrunt.hcl not found"
            ls -la
            exit 1
          fi

      - name: 🏗️ Terragrunt Init
        id: init
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "Initializing Terragrunt in: ${{ inputs.terragrunt-path }}"
          terragrunt init

      # Bootstrap ordering: image-consuming resources (ECS services, Bedrock
      # AgentCore runtimes) reference <repo>:latest. A brand-new agent has no
      # image yet, so we first create ONLY the ECR repositories (targeted
      # apply), then seed any EMPTY repo with a stub image. Repos that already
      # contain a real image (e.g. a live agent) are left untouched. The main
      # plan/apply that follows can then pull images successfully.
      - name: 🐳 Provision ECR & seed stub images
        id: seed-ecr
        working-directory: ${{ inputs.terragrunt-path }}
        shell: bash
        run: |
          set -euo pipefail
          AGENTS_DIR="agents"
          echo "→ Creating agent ECR repositories (targeted apply)..."
          # Derive -target args dynamically from agents/*.hcl (agent key = file
          # basename). Target only the ECR repository resources so a brand-new
          # agent's repos are created without touching anything else. Existing
          # repos are no-ops.
          TARGETS=()
          for f in "$AGENTS_DIR"/*.hcl; do
            [[ -e "$f" ]] || continue
            # Skip agents explicitly disabled via enable_agent = false; those
            # are being torn down, so we must not (re)create their ECR repos.
            if grep -qE '^\s*enable_agent\s*=\s*false' "$f"; then
              echo "  ⏭️  $(basename "$f" .hcl): enable_agent=false, skipping ECR provisioning."
              continue
            fi
            agent="$(basename "$f" .hcl)"
            TARGETS+=( -target="module.agent_runtime[\"$agent\"].aws_ecr_repository.runtime" )
            TARGETS+=( -target="module.ecs_service[\"$agent\"].aws_ecr_repository.slack_bot[0]" )
          done
          if [[ ${#TARGETS[@]} -eq 0 ]]; then
            echo "  No agent configs found; skipping ECR provisioning."
          else
            terragrunt apply -auto-approve "${TARGETS[@]}"
          fi

          echo "→ Seeding empty ECR repositories with stub image..."
          REPO_ROOT="${GITHUB_WORKSPACE}/terraform/infrastructure/agent-platform"
          if [[ -d "$AGENTS_DIR" ]]; then
            "${REPO_ROOT}/scripts/seed-stub-images.sh" "$AGENTS_DIR"
          else
            echo "  No agents dir, skipping seeding."
          fi

      - name: ✅ Terragrunt Validate
        id: validate
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          terragrunt validate

      - name: 📋 Terragrunt Plan
        id: plan
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "Planning deployment with Terragrunt"
          set +e
          terragrunt plan -detailed-exitcode -out=tfplan

          PLAN_EXIT_CODE=$?
          echo "exitcode=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT

          case $PLAN_EXIT_CODE in
            0)
              echo "✅ No changes needed"
              echo "plan-status=no-changes" >> $GITHUB_OUTPUT
              ;;
            1)
              echo "❌ Terragrunt plan failed"
              echo "plan-status=failed" >> $GITHUB_OUTPUT
              exit 1
              ;;
            2)
              echo "📝 Changes detected"
              echo "plan-status=changes-detected" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❓ Unknown exit code: $PLAN_EXIT_CODE"
              echo "plan-status=unknown" >> $GITHUB_OUTPUT
              exit 1
              ;;
          esac

      - name: 🔍 Validate Branch Permissions
        id: branch-check
        if: steps.plan.outputs.exitcode == '2'
        shell: bash
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          BRANCH_REF="${{ github.ref }}"
          ALLOWED=false

          echo "## 🔍 Branch Permission Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | $ENVIRONMENT |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | $BRANCH_REF |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          case $ENVIRONMENT in
            "dev")
              if [[ $BRANCH_REF == refs/heads/feature/* ]]; then
                ALLOWED=true
                echo "| **Status** | ✅ Allowed |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| **Status** | ❌ Not Allowed |" >> $GITHUB_STEP_SUMMARY
                echo "| **Allowed Branches** | feature/* |" >> $GITHUB_STEP_SUMMARY
              fi
              ;;
            "tst")
              if [[ $BRANCH_REF == "refs/heads/develop" ]]; then
                ALLOWED=true
                echo "| **Status** | ✅ Allowed |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| **Status** | ❌ Not Allowed |" >> $GITHUB_STEP_SUMMARY
                echo "| **Allowed Branches** | develop |" >> $GITHUB_STEP_SUMMARY
              fi
              ;;
            "pst"|"prd")
              if [[ $BRANCH_REF == "refs/heads/main" ]] || \
                 [[ $BRANCH_REF == refs/heads/release/* ]]; then
                ALLOWED=true
                echo "| **Status** | ✅ Allowed |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| **Status** | ❌ Not Allowed |" >> $GITHUB_STEP_SUMMARY
                echo "| **Allowed Branches** | main, release/* |" >> $GITHUB_STEP_SUMMARY
              fi
              ;;
            *)
              echo "| **Status** | ❌ Unknown Environment |" >> $GITHUB_STEP_SUMMARY
              ;;
          esac

          if [[ $ALLOWED == "true" ]]; then
            echo "deployment-allowed=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Branch $BRANCH_REF is not allowed to deploy to $ENVIRONMENT environment"
            echo "deployment-allowed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 🚀 Terragrunt Apply
        id: apply
        if: |
          steps.branch-check.outputs.deployment-allowed == 'true' &&
          steps.plan.outputs.exitcode == '2'
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "Applying Terragrunt changes..."
          terragrunt apply tfplan
          echo "✅ Terragrunt apply completed successfully"

      - name: 📊 Show Terragrunt Outputs
        if: steps.apply.outcome == 'success' || steps.plan.outputs.exitcode == '0'
        working-directory: ${{ inputs.terragrunt-path }}
        shell: bash
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Terragrunt Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          terragrunt output 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No outputs available" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 📈 Set Job Status
        id: status
        if: always()
        run: |
          if [[ "${{ steps.apply.outcome }}" == "success" ]] || [[ "${{ steps.plan.outputs.exitcode }}" == "0" ]]; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "Cleaning up workspace..."
          find ${{ inputs.terragrunt-path }} -name ".terragrunt-cache" -type d -exec rm -rf {} + 2>/dev/null || true
          rm -f ${{ inputs.terragrunt-path }}/tfplan || true
