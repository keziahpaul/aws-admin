name: Deploy-onedata-ingress-s3-resources ( should be the first workflow to run before other workflows in salesforce stack. This creates ingress s3 bucket)
on:
  push:
    branches:
      - feature/DD-*
      - develop
    paths:
      - 'cloudformation/parameters/resources-dev/onedata-ingress-snowflake_iam_data.properties'
      - 'cloudformation/parameters/resources-tst/onedata-ingress-snowflake_iam_data.properties'
      - '.github/workflows/onedata-ingress-snowflake-iam-deploy.yml'
  
  pull_request:
    branches:
      - main
    paths:
      - 'cloudformation/parameters/resources-pst/onedata-ingress-snowflake_iam_data.properties'
      - 'cloudformation/parameters/resources-prd/onedata-ingress-snowflake_iam_data.properties'
      - '.github/workflows/onedata-ingress-snowflake-iam-deploy.yml'
  
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout


jobs:
  deploy-onedata-ingress-s3-iam-role-dev:
    name: DEV - Onedata ingress s3 group snowflake role deploy
    if: startsWith(github.ref ,'refs/heads/feature/DD') && github.event_name == 'push' 
    runs-on: [non-prod, deploy]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
          ls -lrt
          Environment='dev'
          StackName='snowflake_iam_data'
          Stack='snowflake-iam-data'
          Parameter=./cloudformation/parameters/resources-${Environment}/onedata-ingress-${StackName}.properties

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo "Stack=$Stack" >> $GITHUB_OUTPUT
          echo "Parameter=$Parameter" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "

      - name: deploy-onedata-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "onedata-ingress-s3-${{ steps.get-parameter.outputs.Stack }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: ${{ steps.get-parameter.outputs.Parameter }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"
  
  deploy-onedata-ingress-s3-iam-role-tst:
    name: TST - Onedata ingress s3 group snowflake role deploy
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push' 
    runs-on: [non-prod, deploy]
    outputs:
      Environment: ${{ steps.get-parameter.outputs.Environment }}
      StackName: ${{ steps.get-parameter.outputs.StackName }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
          ls -lrt
          Environment='tst'
          StackName='snowflake_iam_data'
          Stack='snowflake-iam-data'
          Parameter=./cloudformation/parameters/resources-${Environment}/onedata-ingress-${StackName}.properties

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo "Stack=$Stack" >> $GITHUB_OUTPUT
          echo "Parameter=$Parameter" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "

      - name: deploy-onedata-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "onedata-ingress-s3-${{ steps.get-parameter.outputs.Stack }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: ${{ steps.get-parameter.outputs.Parameter }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"
  
  deploy-onedata-ingress-s3-iam-role-pst:
    name: PST - Onedata ingress s3 group snowflake role deploy
    if: (startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: [prod, deploy]
    environment: pst
    outputs:
      Environment: ${{ steps.get-parameter.outputs.Environment }}
      StackName: ${{ steps.get-parameter.outputs.StackName }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
          ls -lrt
          Environment='pst'
          StackName='snowflake_iam_data'
          Stack='snowflake-iam-data'
          Parameter=./cloudformation/parameters/resources-${Environment}/onedata-ingress-${StackName}.properties

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo "Stack=$Stack" >> $GITHUB_OUTPUT
          echo "Parameter=$Parameter" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "

      - name: deploy-onedata-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "onedata-ingress-s3-${{ steps.get-parameter.outputs.Stack }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: ${{ steps.get-parameter.outputs.Parameter }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

  deploy-onedata-ingress-s3-iam-role-prd:
    name: PROD - Onedata ingress s3 group snowflake role deploy
    if: (startsWith(github.event.pull_request.head.ref, 'release/'))
    needs: [deploy-onedata-ingress-s3-iam-role-pst]
    runs-on: [prod, deploy]
    environment: prd
    outputs:
      Environment: ${{ steps.get-parameter.outputs.Environment }}
      StackName: ${{ steps.get-parameter.outputs.StackName }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
          ls -lrt
          Environment='prd'
          StackName='snowflake_iam_data'
          Stack='snowflake-iam-data'
          Parameter=./cloudformation/parameters/resources-${Environment}/onedata-ingress-${StackName}.properties

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo "Stack=$Stack" >> $GITHUB_OUTPUT
          echo "Parameter=$Parameter" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "

      - name: deploy-onedata-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "onedata-ingress-s3-${{ steps.get-parameter.outputs.Stack }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: ${{ steps.get-parameter.outputs.Parameter }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"