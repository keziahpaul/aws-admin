name: Deploy-Snowflake-IAM-Role [Data-NP]

on:
  workflow_dispatch:
  push:
    branches:
      - feature/DD-*
    paths:
      - '.github/workflows/snowflake-iam-data-nonprod-deploy.yml'
      - 'cloudformation/templates/snowflake_iam_data.yml'


jobs:
  
  datanp-onedata-snowflake-egress-role-deploy:
    name: Dev datanp-onedata-snowflake-egress-role-deploy
    if: startsWith(github.ref ,'refs/heads/feature/DD') && github.event_name == 'push' 
    uses: ./.github/workflows/reusable-data-snowflake-iam-deploy.yml
    with:
      S3BucketName: "salesforce-appflow-data-test"
      SnowflakePrincipalArn: "arn:aws:iam::178848603211:user/ztt10000-s"
      SnowflakeExternalId: "DJ58410_SFCRole=group_salesforce_s3_integration"
      RunnerEnvironment: "non-prod"
      Environment: "dev"
      AWSAccountNumber: "042775015153"
      CFTemplate: "cloudformation/templates/snowflake_iam_data.yml"
      CFStackName: "onedata-snowflake-group-egress-iam-role"
      GitHubDeployRole: "GitHubRunnerPEXAOneDataRole"
      IAMRoleName: "pexa-one-data-group-snowflake-access"
      KMSKeyResourceType: "key"
      KMSKeyResourceValue: "f5ece3f0-dfcb-11eb-8669-02a2f8b8723c" 
  