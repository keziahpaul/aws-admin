
name: Deploy-onedata-pxi-resources-data-secrets
on:
  push:
    branches:
      - feature/DD-*
      - develop
    paths:
      - 'cloudformation/parameters/resources-*/onedata-pxi-resources/onedata-pxi-resources-data-secrets.properties'
      - '.github/workflows/onedata-pxi-resources-deploy-data-secrets.yml'
      - 'cloudformation/templates/onedata-pxi-resources/onedata-pxi-resources-data-secrets.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'cloudformation/parameters/resources-*/onedata-pxi-resources/onedata-pxi-resources-data-secrets.properties'
      - '.github/workflows/onedata-pxi-resources-deploy-data-secrets.yml'
      - 'cloudformation/templates/onedata-pxi-resources/onedata-pxi-resources-data-secrets.yml'
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

env:
  STACK_NAME: onedata-pxi-resources-data-secrets
  GITHUB_DEPLOY_ROLE: GitHubRunnerPEXAOneDataRole
  TEMPLATE_PATH: cloudformation/templates/onedata-pxi-resources/onedata-pxi-resources-data-secrets.yml

jobs:
  deploy-onedata-pxi-resources-data-secrets-dev:
    name: deploy-onedata-pxi-resources-data-secrets-dev
    if: startsWith(github.ref ,'refs/heads/feature/DD') && github.event_name == 'push'
    runs-on: [non-prod, deploy]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: deploy-onedata-pxi-secrets
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.STACK_NAME }}-dev"
          template: ${{ env.TEMPLATE_PATH }}
          Environment: dev
          ParameterPath: "./cloudformation/parameters/resources-dev/onedata-pxi-resources/${{ env.STACK_NAME }}.properties"
          GitHubDeploy_IAM_ROLE: ${{ env.GITHUB_DEPLOY_ROLE }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

  deploy-onedata-pxi-resources-data-secrets-tst:
    name: deploy-onedata-pxi-resources-data-secrets-tst
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: [non-prod, deploy]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: deploy-onedata-pxi-secrets
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.STACK_NAME }}-tst"
          template: ${{ env.TEMPLATE_PATH }}
          Environment: tst
          ParameterPath: "./cloudformation/parameters/resources-tst/onedata-pxi-resources/${{ env.STACK_NAME }}.properties"
          GitHubDeploy_IAM_ROLE: ${{ env.GITHUB_DEPLOY_ROLE }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

  deploy-onedata-pxi-resources-data-secrets-pst:
    name: deploy-onedata-pxi-resources-data-secrets-pst
    if: (startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: [non-prod, deploy]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: deploy-onedata-pxi-secrets
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.STACK_NAME }}-pst"
          template: ${{ env.TEMPLATE_PATH }}
          Environment: pst
          ParameterPath: "./cloudformation/parameters/resources-pst/onedata-pxi-resources/${{ env.STACK_NAME }}.properties"
          GitHubDeploy_IAM_ROLE: ${{ env.GITHUB_DEPLOY_ROLE }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

  deploy-onedata-pxi-resources-data-secrets-prod:
    name: deploy-onedata-pxi-resources-data-secrets-prod
    if: startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.base.ref == 'main'
    environment: prd
    runs-on: [prod, deploy]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: deploy-onedata-pxi-secrets
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.STACK_NAME }}-prod"
          template: ${{ env.TEMPLATE_PATH }}
          Environment: prd
          ParameterPath: "./cloudformation/parameters/resources-prd/onedata-pxi-resources/${{ env.STACK_NAME }}.properties"
          GitHubDeploy_IAM_ROLE: ${{ env.GITHUB_DEPLOY_ROLE }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"