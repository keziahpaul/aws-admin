name: Deploy-Snowflake-IAM-Role [Digital-NP]

on:
  workflow_dispatch:

jobs:
  digitalnp-dev-onedata-snowflake-egress-role-deploy:
    uses: ./.github/workflows/reusable-digital-snowflake-iam-deploy.yml
    with:
      Environment: "dev"
      RunnerEnvironment: "non-prod"
      AWSAccountNumber: "570723136177"
      CFTemplate: "cloudformation/templates/snowflake_iam_digital.yml"
      CFStackName: "dev-onedata-snowflake-iam-role"
      GitHubDeployRole: "GitHubRunnerPEXAOneDataRole"
      ProjectsS3BucketName: "onedata-projects-570723136177-dev"
      SnowflakePrincipalArn: "arn:aws:iam::178848603211:user/ygr10000-s"
      SnowflakeExternalIdProjects: "QN78122_SFCRole=dev_projects_s3_integration"

  digitalnp-tst-onedata-snowflake-egress-role-deploy:
    needs: [digitalnp-dev-onedata-snowflake-egress-role-deploy]
    uses: ./.github/workflows/reusable-digital-snowflake-iam-deploy.yml
    with:
      Environment: "tst"
      RunnerEnvironment: "non-prod"
      AWSAccountNumber: "570723136177"
      CFTemplate: "cloudformation/templates/snowflake_iam_digital.yml"
      CFStackName: "tst-onedata-snowflake-iam-role"
      GitHubDeployRole: "GitHubRunnerPEXAOneDataRole"
      ProjectsS3BucketName: "onedata-projects-570723136177-tst"
      SnowflakePrincipalArn: "arn:aws:iam::178848603211:user/ygr10000-s"
      SnowflakeExternalIdProjects: "QN78122_SFCRole=dev_projects_s3_integration"

  digitalnp-pst-onedata-snowflake-egress-role-deploy:
    needs: [digitalnp-tst-onedata-snowflake-egress-role-deploy]
    uses: ./.github/workflows/reusable-digital-snowflake-iam-deploy.yml
    with:
      Environment: "pst"
      RunnerEnvironment: "non-prod"
      AWSAccountNumber: "570723136177"
      CFTemplate: "cloudformation/templates/snowflake_iam_digital.yml"
      CFStackName: "pst-onedata-snowflake-iam-role"
      GitHubDeployRole: "GitHubRunnerPEXAOneDataRole"
      ProjectsS3BucketName: "onedata-projects-570723136177-pst"
      SnowflakePrincipalArn: "arn:aws:iam::872897688295:user/c9ii0000-s"
      SnowflakeExternalIdProjects: "ZZ82647_SFCRole=pst_projects_s3_integration"