
name: Deploy-onedata-projects-resources-digital-s3-iam
on:
  push:
    branches:
      - feature/DD-*
      - feature/prf-*
      - develop
    paths:
      - 'cloudformation/parameters/resources-*/onedata-projects-resources/onedata-projects-resources-digital-s3-iam.properties'
      - '.github/workflows/onedata-projects-resources-digital-s3-iam-deploy.yml'
      - 'cloudformation/templates/onedata-projects-resources/onedata-projects-resources-digital-s3-iam.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'cloudformation/parameters/resources-*/onedata-projects-resources/onedata-projects-resources-digital-s3-iam.properties'
      - '.github/workflows/onedata-projects-resources-digital-s3-iam-deploy.yml'
      - 'cloudformation/templates/onedata-projects-resources/onedata-projects-resources-digital-s3-iam.yml'
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

env:
  STACK_NAME: onedata-projects-resources-digital-s3-iam
  GITHUB_DEPLOY_ROLE: GitHubRunnerPEXAOneDataRole
  TEMPLATE_PATH: cloudformation/templates/onedata-projects-resources/onedata-projects-resources-digital-s3-iam.yml

jobs:
  deploy-onedata-projects-resources-digital-s3-iam-dev:
    name: deploy-onedata-projects-resources-digital-s3-iam-dev
    if: startsWith(github.ref ,'refs/heads/feature/DD') && github.event_name == 'push'
    runs-on: [non-prod, deploy]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: deploy-onedata-projects-s3-storage-iam
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.STACK_NAME }}-dev"
          template: ${{ env.TEMPLATE_PATH }}
          Environment: dev
          ParameterPath: "./cloudformation/parameters/resources-dev/onedata-projects-resources/${{ env.STACK_NAME }}.properties"
          GitHubDeploy_IAM_ROLE: ${{ env.GITHUB_DEPLOY_ROLE }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

  deploy-onedata-projects-resources-digital-s3-iam-tst:
    name: deploy-onedata-projects-resources-digital-s3-iam-tst
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: [non-prod, deploy]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: deploy-onedata-projects-s3-storage-iam
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.STACK_NAME }}-tst"
          template: ${{ env.TEMPLATE_PATH }}
          Environment: tst
          ParameterPath: "./cloudformation/parameters/resources-tst/onedata-projects-resources/${{ env.STACK_NAME }}.properties"
          GitHubDeploy_IAM_ROLE: ${{ env.GITHUB_DEPLOY_ROLE }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"


  deploy-onedata-projects-resources-digital-s3-iam-pst:
    name: deploy-onedata-projects-resources-digital-s3-iam-pst
    if: startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: [non-prod, deploy]
    environment: pst
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: deploy-onedata-projects-s3-storage-iam
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.STACK_NAME }}-pst"
          template: ${{ env.TEMPLATE_PATH }}
          Environment: pst
          ParameterPath: "./cloudformation/parameters/resources-pst/onedata-projects-resources/${{ env.STACK_NAME }}.properties"
          GitHubDeploy_IAM_ROLE: ${{ env.GITHUB_DEPLOY_ROLE }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

  deploy-onedata-projects-resources-digital-s3-iam-prd:
    name: deploy-onedata-projects-resources-digital-s3-iam-prd
    if: startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: [prod, deploy]
    needs: [deploy-onedata-projects-resources-digital-s3-iam-pst]
    environment: prd
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: deploy-onedata-projects-s3-storage-iam
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ env.STACK_NAME }}-prd"
          template: ${{ env.TEMPLATE_PATH }}
          Environment: prd
          ParameterPath: "./cloudformation/parameters/resources-prd/onedata-projects-resources/${{ env.STACK_NAME }}.properties"
          GitHubDeploy_IAM_ROLE: ${{ env.GITHUB_DEPLOY_ROLE }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"
