name: Deploy Data Ingestion Infrastructure

on:
  workflow_dispatch:
    inputs:
      infrastructure-type:
        description: 'Infrastructure Type'
        required: true
        type: choice
        options:
          - 's3'
          - 'lambda'
      aws-account:
        description: 'AWS Account'
        required: true
        type: choice
        options:
          - 'data-nonprod'
          - 'data-prod'
      no-execute-changeset:
        description: 'Do NOT Execute (dry run mode)'
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      infrastructure-type:
        description: 'Infrastructure Type'
        required: true
        type: string
      aws-account:
        description: 'AWS Account'
        required: true
        type: string
      no-execute-changeset:
        description: 'Do NOT Execute (dry run mode)'
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Configuration
    runs-on: ['non-prod', 'deploy']
    outputs:
      aws-account-id: ${{ steps.config.outputs.aws-account-id }}
      runner-type: ${{ steps.config.outputs.runner-type }}
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🔍 Load & Validate Configuration
        id: config
        run: |
          CONFIG_FILE=".github/config/data-ingestion-accounts.json"

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "❌ Configuration file not found: $CONFIG_FILE"
            exit 1
          fi

          ACCOUNT_CONFIG=$(jq -r ".accounts?[\"${{ inputs.aws-account }}\"]" "$CONFIG_FILE")
          if [[ -z "$ACCOUNT_CONFIG" || "$ACCOUNT_CONFIG" == "null" ]]; then
            echo "❌ Invalid AWS account: ${{ inputs.aws-account }}"
            exit 1
          fi

          echo "aws-account-id=$(echo "$ACCOUNT_CONFIG" | jq -r '.account_id')" >> $GITHUB_OUTPUT
          echo "runner-type=$(echo "$ACCOUNT_CONFIG" | jq -r '.runner_type')" >> $GITHUB_OUTPUT

  # ---- S3 Jobs ----

  deploy-s3-dev:
    name: Deploy S3 to dev
    needs: validate
    if: inputs.infrastructure-type == 's3' && inputs.aws-account == 'data-nonprod' && startsWith(github.ref, 'refs/heads/feature/')
    uses: ./.github/workflows/reusable-data-ingestion-s3.yml
    with:
      environment: dev
      runner-type: ${{ needs.validate.outputs.runner-type }}
      aws-account: ${{ needs.validate.outputs.aws-account-id }}
      terragrunt-path: terraform/infrastructure/s3/environments/datanp/dev
      no-execute-changeset: ${{ inputs.no-execute-changeset }}

  deploy-s3-tst:
    name: Deploy S3 to tst
    needs: validate
    if: inputs.infrastructure-type == 's3' && inputs.aws-account == 'data-nonprod' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable-data-ingestion-s3.yml
    with:
      environment: tst
      runner-type: ${{ needs.validate.outputs.runner-type }}
      aws-account: ${{ needs.validate.outputs.aws-account-id }}
      terragrunt-path: terraform/infrastructure/s3/environments/datanp/tst
      no-execute-changeset: ${{ inputs.no-execute-changeset }}

  deploy-s3-pst:
    name: Deploy S3 to pst
    needs: validate
    if: inputs.infrastructure-type == 's3' && inputs.aws-account == 'data-prod' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    uses: ./.github/workflows/reusable-data-ingestion-s3.yml
    with:
      environment: pst
      runner-type: ${{ needs.validate.outputs.runner-type }}
      aws-account: ${{ needs.validate.outputs.aws-account-id }}
      terragrunt-path: terraform/infrastructure/s3/environments/dataprd/pst
      no-execute-changeset: ${{ inputs.no-execute-changeset }}

  deploy-s3-prd:
    name: Deploy S3 to prd
    needs: [validate, deploy-s3-pst]
    if: inputs.infrastructure-type == 's3' && inputs.aws-account == 'data-prod' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    uses: ./.github/workflows/reusable-data-ingestion-s3.yml
    with:
      environment: prd
      runner-type: ${{ needs.validate.outputs.runner-type }}
      aws-account: ${{ needs.validate.outputs.aws-account-id }}
      terragrunt-path: terraform/infrastructure/s3/environments/dataprd/prd
      no-execute-changeset: ${{ inputs.no-execute-changeset }}

  # ---- Lambda Jobs ----

  deploy-lambda-dev:
    name: Deploy Lambda to dev
    needs: validate
    if: inputs.infrastructure-type == 'lambda' && inputs.aws-account == 'data-nonprod' && startsWith(github.ref, 'refs/heads/feature/')
    uses: ./.github/workflows/reusable-data-ingestion-lambda.yml
    with:
      environment: dev
      runner-type: ${{ needs.validate.outputs.runner-type }}
      aws-account: ${{ needs.validate.outputs.aws-account-id }}
      terragrunt-path: terraform/infrastructure/lambda/environments/datanp/dev
      no-execute-changeset: ${{ inputs.no-execute-changeset }}

  deploy-lambda-tst:
    name: Deploy Lambda to tst
    needs: validate
    if: inputs.infrastructure-type == 'lambda' && inputs.aws-account == 'data-nonprod' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable-data-ingestion-lambda.yml
    with:
      environment: tst
      runner-type: ${{ needs.validate.outputs.runner-type }}
      aws-account: ${{ needs.validate.outputs.aws-account-id }}
      terragrunt-path: terraform/infrastructure/lambda/environments/datanp/tst
      no-execute-changeset: ${{ inputs.no-execute-changeset }}

  deploy-lambda-pst:
    name: Deploy Lambda to pst
    needs: validate
    if: inputs.infrastructure-type == 'lambda' && inputs.aws-account == 'data-prod' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    uses: ./.github/workflows/reusable-data-ingestion-lambda.yml
    with:
      environment: pst
      runner-type: ${{ needs.validate.outputs.runner-type }}
      aws-account: ${{ needs.validate.outputs.aws-account-id }}
      terragrunt-path: terraform/infrastructure/lambda/environments/dataprd/pst
      no-execute-changeset: ${{ inputs.no-execute-changeset }}

  deploy-lambda-prd:
    name: Deploy Lambda to prd
    needs: [validate, deploy-lambda-pst]
    if: inputs.infrastructure-type == 'lambda' && inputs.aws-account == 'data-prod' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    uses: ./.github/workflows/reusable-data-ingestion-lambda.yml
    with:
      environment: prd
      runner-type: ${{ needs.validate.outputs.runner-type }}
      aws-account: ${{ needs.validate.outputs.aws-account-id }}
      terragrunt-path: terraform/infrastructure/lambda/environments/dataprd/prd
      no-execute-changeset: ${{ inputs.no-execute-changeset }}
