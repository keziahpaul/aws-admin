## SCIM Token Generation Workflow #################################################################################################
## Generates SCIM access tokens for Okta provisioning across Snowflake accounts.
##
## SCIM tokens are account-level (not environment-level):
##   - nonprod: QN78122 (exchange), DJ58410 (group), WY17498 (landinsights), HP89999 (value-australia)
##   - prod:    ZZ82647 (exchange), JV60414 (group), US08173 (landinsights), VO84682 (value-australia)
##
## Tokens are valid for 6 months. Script checks expiry and only regenerates if within 45 days of expiry.
##
## Secrets stored in AWS Secrets Manager:
##   - onedata/snowflake/{account}/{nonprod|prod}/scim-token
##
## Prerequisites:
##   - Snowflake role {DEV|PRD}_GITHUB_INTEGRATION_ROLE_S must have permission to execute SYSTEM$GENERATE_SCIM_ACCESS_TOKEN
##   - AWS credentials secret: onedata_{non-prod|prod}_{account}_snowflake-github-admin-user-private-key
##
## Schedule: Weekly on Monday at 12:00 UTC (10pm AEST or 11pm AEDT, depending on daylight saving) - outside business hours
## Manual: Select env_type (nonprod/prod) and optionally a specific account
##########################################################################################################################################################
name: Generate SCIM Tokens

on:
  schedule:
    - cron: '0 12 * * 1'  # Weekly every Monday at 12:00 UTC (10pm AEST or 11pm AEDT, depending on daylight saving)
  workflow_dispatch:
    inputs:
      env_type:
        type: choice
        description: Select environment type
        default: nonprod
        options:
          - nonprod
          - prod
      account:
        type: choice
        description: Select account (or 'all')
        default: all
        options:
          - all
          - exchange
          - group
          - landinsights
          - value-australia
          - aml
          - px
      dry_run:
        type: boolean
        description: Dry run (no secret updates)
        default: true

permissions:
  id-token: write
  contents: read

env:
  SLACK_CHANNEL_ID: 'C0AR8DZMGQY'

jobs:
  generate-scim-tokens-nonprod:
    name: Generate SCIM Tokens (nonprod)
    if: github.event_name == 'schedule' || github.event.inputs.env_type == 'nonprod'
    runs-on: [non-prod, deploy]
    container:
      image: 004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/pexa-one-data-snowflake-au-common-lib:latest_prod

    steps:
      - name: Assume AWS Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::${{ vars.NONPROD_PEXAONEDATA_AWS_ACCOUNT }}:role/GitHubRunnerPEXAOneDataRole
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Generate SCIM tokens
        id: generate
        shell: bash
        run: |
          ACCOUNT="${{ github.event.inputs.account || 'all' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          
          ARGS="--env-type nonprod"
          [[ "$ACCOUNT" != "all" ]] && ARGS="$ARGS --account $ACCOUNT"
          [[ "$DRY_RUN" == "true" ]] && ARGS="$ARGS --dry-run"
          
          OUTPUT=$(python utils/generate_scim_tokens.py $ARGS)
          echo "generate_status=$(echo "$OUTPUT" | jq -r '.generate_status')" >> $GITHUB_OUTPUT
          echo "accounts_regenerated=$(echo "$OUTPUT" | jq -r '.accounts_regenerated // empty')" >> $GITHUB_OUTPUT
          echo "error_details=$(echo "$OUTPUT" | jq -r '.error_details // empty')" >> $GITHUB_OUTPUT
        env:
          PYTHONUNBUFFERED: 1

      - name: Checkout notifications repo
        if: steps.generate.outputs.generate_status == 'tokens-generated' || steps.generate.outputs.generate_status == 'failed'
        uses: actions/checkout@v7
        with:
          repository: PEXA-AU/pexa-one-data-aws-admin
          ssh-key: ${{ secrets.ONEDATA_AWS_ADMIN_REPO_PRIVATE_KEY }}
          path: pexa-one-data-aws-admin
          ref: main

      - name: Send Slack notification
        if: steps.generate.outputs.generate_status == 'tokens-generated'
        shell: bash
        run: |
          python3 pexa-one-data-aws-admin/scripts/send_slack_message.py \
            "${{ env.SLACK_CHANNEL_ID }}" \
            "✅ SCIM token has been regenerated for accounts: *${{ steps.generate.outputs.accounts_regenerated }}* (nonprod) and stored at AWS Data nonprod account Secrets Manager path: \`onedata/snowflake/{account}/nonprod/scim-token\`"

      - name: Send Slack error notification
        if: steps.generate.outputs.generate_status == 'failed'
        shell: bash
        run: |
          python3 pexa-one-data-aws-admin/scripts/send_slack_message.py \
            "${{ env.SLACK_CHANNEL_ID }}" \
            "❌ Snowflake SCIM token generation failed (nonprod): ${{ steps.generate.outputs.error_details }}"

      - name: Fail job if errors
        if: steps.generate.outputs.generate_status == 'failed'
        run: exit 1

  generate-scim-tokens-prod:
    name: Generate SCIM Tokens (prod)
    if: github.event_name == 'schedule' || github.event.inputs.env_type == 'prod'
    runs-on: [prod, deploy]
    container:
      image: 004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/pexa-one-data-snowflake-au-common-lib:latest_prod

    steps:
      - name: Assume AWS Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::${{ vars.PROD_PEXAONEDATA_AWS_ACCOUNT }}:role/GitHubRunnerPEXAOneDataRole
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Generate SCIM tokens
        id: generate
        shell: bash
        run: |
          ACCOUNT="${{ github.event.inputs.account || 'all' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          
          ARGS="--env-type prod"
          [[ "$ACCOUNT" != "all" ]] && ARGS="$ARGS --account $ACCOUNT"
          [[ "$DRY_RUN" == "true" ]] && ARGS="$ARGS --dry-run"
          
          OUTPUT=$(python utils/generate_scim_tokens.py $ARGS)
          echo "generate_status=$(echo "$OUTPUT" | jq -r '.generate_status')" >> $GITHUB_OUTPUT
          echo "accounts_regenerated=$(echo "$OUTPUT" | jq -r '.accounts_regenerated // empty')" >> $GITHUB_OUTPUT
          echo "error_details=$(echo "$OUTPUT" | jq -r '.error_details // empty')" >> $GITHUB_OUTPUT
        env:
          PYTHONUNBUFFERED: 1

      - name: Checkout notifications repo
        if: steps.generate.outputs.generate_status == 'tokens-generated' || steps.generate.outputs.generate_status == 'failed'
        uses: actions/checkout@v7
        with:
          repository: PEXA-AU/pexa-one-data-aws-admin
          ssh-key: ${{ secrets.ONEDATA_AWS_ADMIN_REPO_PRIVATE_KEY }}
          path: pexa-one-data-aws-admin
          ref: main

      - name: Send Slack notification
        if: steps.generate.outputs.generate_status == 'tokens-generated'
        shell: bash
        run: |
          python3 pexa-one-data-aws-admin/scripts/send_slack_message.py \
            "${{ env.SLACK_CHANNEL_ID }}" \
            "✅ SCIM token has been regenerated for accounts: *${{ steps.generate.outputs.accounts_regenerated }}* (prod) and stored at AWS Data prod account Secrets Manager path: \`onedata/snowflake/{account}/prod/scim-token\`"

      - name: Send Slack error notification
        if: steps.generate.outputs.generate_status == 'failed'
        shell: bash
        run: |
          python3 pexa-one-data-aws-admin/scripts/send_slack_message.py \
            "${{ env.SLACK_CHANNEL_ID }}" \
            "❌ Snowflake SCIM token generation failed (prod): ${{ steps.generate.outputs.error_details }}"

      - name: Fail job if errors
        if: steps.generate.outputs.generate_status == 'failed'
        run: exit 1
