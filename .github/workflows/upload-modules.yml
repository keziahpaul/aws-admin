name: Upload_Module

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'version/modules-version.txt'  
 


jobs:
  
  upload-artifiacts:
    name: Upload artifacts
    runs-on: [non-prod, deploy]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Generate New Version
        id: get-version
        uses: PEXA-AU/github-action-auto-semver@2.0.8
        with:
          base-version-file: ./version/modules-version.txt

      - name: zip artifacts
        id: get-module-flder-nm
        env:
          git_ref: ${{ github.ref }}
        run: |
          if [[ ${{ env.git_ref }} == 'refs/heads/main' ]]; then
            echo 'main'
            module_folder=onedata-common-repo
            
          elif [[ ${{ env.git_ref }} == 'refs/heads/develop' ]]; then
            echo 'develop'
            module_folder=onedata-common-repo-test
          fi
          module_zip=common-schemachange-repo-${{ steps.get-version.outputs.version }}.zip

          zip -r -v $module_zip "./schemachange/modules/"
          mkdir ${module_folder} && mv ${module_zip} "$_"

          echo "module_folder=${module_folder}" >> $GITHUB_OUTPUT
          echo "module_zip=${module_zip}" >> $GITHUB_OUTPUT
        working-directory: ${{github.workspace }}

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4.10.1
        env:
          JF_URL: "https://pexaartifacts.jfrog.io/"
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          
      - name: Ping JFrog Artifactory
        run: |
          ls
          jfrog rt ping
          
          jf rt u ${{ steps.get-module-flder-nm.outputs.module_folder }}/ one-data/ --build-name=${{ github.repository }} --build-number=${{ github.run_number }}
          
          response=`jfrog rt s --count "one-data/${{ steps.get-module-flder-nm.outputs.module_folder }}/${{ steps.get-module-flder-nm.outputs.module_zip }}"`

          
          ####### check for the artifactory in jfrog, and exit if not found, this check is introduced since when folder structure is not properly mentioned the upload succeeds with no actual uploads
          if [[ $response == 0 ]]; then
            echo "Artifactory upload FAILED"
            exit 1
          else
            echo "Artifactory uploaded COMPLETED"
          fi 
      
