name: streamlit-app-artefacts-deploy
on:
  workflow_call:

    inputs:
      account:
        type: string
        description: Select snowflake account
        default: sandbox
      folder_name:
        type: string
        description: 'Folder name containing streamlit files to upload. Please keep the app folder within streamlit/'
        required: true
      environment:
        type: string
        description: 'Select snowflake environment'
        default: dev
      snowflake_database:
        type: string
        description: 'database where app is created'
        default: dev_sandbox
      snowflake_schema:
        type: string
        description: 'schema where app is created'
        required: true
      python_file_path:
        type: string
        description: python file location
        default: './utils/streamlit_app_artefacts_upload_to_stage.py'
      workflow_branch:
        type: string
        default: main
    secrets:
      token:
        required: true



env:

  accountName: '{"exchange-dev": "QN78122", "exchange-tst": "QN78122","exchange-pst": "ZZ82647", "exchange-prd": "ZZ82647"
                  , "landinsights-dev" : "WY17498", "landinsights-tst" : "WY17498", "landinsights-pst" : "US08173", "landinsights-prd" : "US08173"
                  , "value-australia-dev" : "HP89999", "value-australia-tst" : "HP89999", "value-australia-pst" : "VO84682", "value-australia-prd" : "VO84682"
                  , "group-dev": "DJ58410",  "group-tst": "DJ58410", "group-pst": "JV60414", "group-prd": "JV60414"
                  , "group-azure-dev": "EH91822", "group-azure-tst": "EH91822", "group-azure-pst": "EN45970", "group-azure-prd": "EN45970"}'
  ROLE_TO_ASSUME: arn:aws:iam::${{ vars.NONPROD_PEXAONEDATA_AWS_ACCOUNT }}:role/GitHubRunnerPEXAOneDataBuildRole
  ECR_REPOSITORY: pexa-one-data-snowflake-au-common-lib
  IMAGE: 004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/pexa-one-data-snowflake-au-common-lib:latest_prod
  PROD_AWS_ACCOUNT: '${{ vars.PROD_PEXAONEDATA_AWS_ACCOUNT }}'
  NONPROD_AWS_ACCOUNT: '${{ vars.NONPROD_PEXAONEDATA_AWS_ACCOUNT }}'
  checkout_branch: ${{ inputs.workflow_branch  }}


jobs:
  get_Account_Name_Detail:
    name: get Account Name based on Inputs
    runs-on: [prod, deploy]
    outputs:
      run_rest_jobs: ${{ steps.get_Account_Name.outputs.run_rest_jobs }}
      accName: ${{ steps.get_Account_Name.outputs.accName }}
      deploy_environment: ${{ steps.get_Account_Name.outputs.deploy_environment }}
      acc_input: ${{ steps.get_Account_Name.outputs.acc_input }}
      env_input: ${{ steps.get_Account_Name.outputs.env_input }}
      image: ${{ steps.get_Account_Name.outputs.image }}
      snowflake_acc_region: ${{ steps.get_Account_Name.outputs.snowflake_acc_region }}
      aws_secret_account: ${{ steps.set_aws_account.outputs.aws_secret_account }}

    steps:

      - name: Get Account Details
        id: get_Account_Name
        uses: PEXA-AU/pexa-one-data-snowflake-au-common-lib/.github/actions/getAccountDetails@main
        with:
          ACC_INPUT: ${{ github.event.inputs.account  }}
          ENV_INPUT: ${{ github.event.inputs.environment  }}
          ACCNAME: ${{ env.accountName }}
          PROD_AWS_ACCOUNT: '${{ vars.PROD_PEXAONEDATA_AWS_ACCOUNT }}'
          NONPROD_AWS_ACCOUNT: '${{ vars.NONPROD_PEXAONEDATA_AWS_ACCOUNT }}'


      - name: Set AWS Account Number
        id: set_aws_account
        run: |
          if [ "${{ steps.get_Account_Name.outputs.deploy_environment }}" == "prod" ]; then
            echo "aws_secret_account=${{ env.PROD_AWS_ACCOUNT }}" >> $GITHUB_OUTPUT
          else
            echo "aws_secret_account=${{ env.NONPROD_AWS_ACCOUNT }}" >> $GITHUB_OUTPUT
          fi

  upload-streamlit-artefacts-deploy:
    if:  needs.get_Account_Name_Detail.outputs.run_rest_jobs  == 'true'
    name: upload streamlit artefacts deploy
    runs-on: [prod, deploy]
    needs: [get_Account_Name_Detail]
    container:
      image: ${{ needs.get_Account_Name_Detail.outputs.image }}
    env:
      environment: ${{ needs.get_Account_Name_Detail.outputs.env_input }}
      account: ${{ needs.get_Account_Name_Detail.outputs.acc_input }}
      accName: ${{ needs.get_Account_Name_Detail.outputs.accName }}
      deploy_environment: ${{ needs.get_Account_Name_Detail.outputs.deploy_environment }}
      SNOWFLAKE_PRIVATE_KEY_FILE: github_integration_user_private_key.p8
      snowflake_acc_region: ${{ needs.get_Account_Name_Detail.outputs.snowflake_acc_region }}
      aws_secret_account: ${{ needs.get_Account_Name_Detail.outputs.aws_secret_account }}

    steps:

      - name: Assume Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::${{ env.aws_secret_account }}:role/GitHubRunnerPEXAOneDataRole
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Checkout actions
        uses: actions/checkout@v7

      - name: Fetch Snowflake Creds
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SNOWFLAKE_PRIVATE_KEY,onedata_${{ env.deploy_environment }}_${{ env.environment  }}_${{ env.account  }}_snowflake-github-user-private-key
            SNOWFLAKE_PRIVATE_KEY_PASSPHRASE,onedata_${{ env.deploy_environment }}_${{ env.environment  }}_${{ env.account  }}_snowflake-github-user-passphrase


      - name: Copy Private key file
        run: |
          echo '${{ env.SNOWFLAKE_PRIVATE_KEY }}' >> github_integration_user_private_key.p8
          chmod 600 github_integration_user_private_key.p8

      - name: Install dependencies
        run: |
          pip install snowflake-connector-python
          pip install boto3

      - name: download python file
        uses: actions/download-artifact@v6
        with:
          name: streamlit_app_artefacts_upload_to_stage.py
          path: pexa-one-data-snowflake-au-common-lib/utils/

      - name: Upload files to Snowflake
        env:
          SNOWFLAKE_ACCOUNT: ${{ env.accName }}.${{env.snowflake_acc_region}}
          SNOWFLAKE_USER: ${{ inputs.environment }}_github_integration_user
          SNOWFLAKE_ROLE: ${{ inputs.environment }}_github_integration_role_s
          SNOWFLAKE_DATABASE: ${{ inputs.snowflake_database}}
          SNOWFLAKE_SCHEMA: ${{ inputs.snowflake_schema}}
          FOLDER_NAME: ${{ inputs.folder_name }}
          INTERNAL_STAGE: ${{ inputs.environment }}_streamlit_apps
          SNOWFLAKE_PRIVATE_KEY: ${{ env.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          python pexa-one-data-snowflake-au-common-lib/utils/streamlit_app_artefacts_upload_to_stage.py \
          --snowflake_user "${{ env.SNOWFLAKE_USER }}" \
          --snowflake_account "${{ env.SNOWFLAKE_ACCOUNT }}" \
          --snowflake_role "${{ env.SNOWFLAKE_ROLE }}" \
          --snowflake_private_key "${{ env.SNOWFLAKE_PRIVATE_KEY }}" \
          --folder_name "${{ env.FOLDER_NAME }}" \
          --internal_stage "${{ env.INTERNAL_STAGE }}" \
          --passphrase "${{ env.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}" \
          --private_key_file "${{ env.SNOWFLAKE_PRIVATE_KEY_FILE }}" \
          --snowflake_database "${{ env.SNOWFLAKE_DATABASE }}" \
          --snowflake_schema "${{ env.SNOWFLAKE_SCHEMA }}"