name: Deploy-onedata-pexakey-resources-data-s3 ( should run after Deploy-onedata-pexakey-resources-data, Deploy-onedata-pexakey-resources-gateway, PROD-Deploy-Role-onedata-pexakey-exchg-snowflake-role-deploy [Data-Prod]/NON-PROD-Deploy-Role-onedata-pexakey-exchg-snowflake-role-deploy [Data-NP], and Deploy-onedata-pexakey-resources-digital)
on:
  push:
    branches:
      - feature/DD-*
      - develop
    paths:
      - 'cloudformation/parameters/resources-dev/onedata-pexakey-resources/onedata-pexakey-resources-data-s3.properties'
      - 'cloudformation/parameters/resources-tst/onedata-pexakey-resources/onedata-pexakey-resources-data-s3.properties'
      - '.github/workflows/onedata-pexakey-resources-data-s3-deploy.yml'
      - 'cloudformation/templates/onedata-pexakey-resources/onedata-pexakey-resources-data-s3.yml'
  
  pull_request:
    branches:
      - main
    paths:
      - 'cloudformation/parameters/resources-pst/onedata-pexakey-resources/onedata-pexakey-resources-data-s3.properties'
      - 'cloudformation/parameters/resources-prd/onedata-pexakey-resources/onedata-pexakey-resources-data-s3.properties'
      - '.github/workflows/onedata-pexakey-resources-data-s3-deploy.yml'
      - 'cloudformation/templates/onedata-pexakey-resources/onedata-pexakey-resources-data-s3.yml'
  
  

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout


jobs:
  deploy-onedata-pexakey-resources-data-s3-dev:
    name: DEV deploy onedata pexakey S3 resources
    if: startsWith(github.ref ,'refs/heads/feature/DD') && github.event_name == 'push' 
    runs-on: [non-prod, deploy]
    environment: dev
    outputs:
      Environment: ${{ steps.get-parameter.outputs.Environment }}
      StackName: ${{ steps.get-parameter.outputs.StackName }}
      Parameter: ${{ steps.get-parameter.outputs.Parameter }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
         ls -lrt
          Environment='dev'
          StackName='onedata-pexakey-resources-data-s3'
          Parameter=./cloudformation/parameters/resources-${Environment}/onedata-pexakey-resources/${StackName}.properties

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo "Parameter=$Parameter" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "



      - name: deploy-onedata-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ steps.get-parameter.outputs.StackName }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/onedata-pexakey-resources/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: ${{ steps.get-parameter.outputs.Parameter }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"
  
  deploy-onedata-pexakey-resources-data-s3-tst:
    name: TST deploy onedata pexakey S3 resources
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push' 
    runs-on: [non-prod, deploy]
    environment: tst
    outputs:
      Environment: ${{ steps.get-parameter.outputs.Environment }}
      StackName: ${{ steps.get-parameter.outputs.StackName }}
      Parameter: ${{ steps.get-parameter.outputs.Parameter }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
         ls -lrt
          Environment='tst'
          StackName='onedata-pexakey-resources-data-s3'
          Parameter=./cloudformation/parameters/resources-${Environment}/onedata-pexakey-resources/${StackName}.properties

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo "Parameter=$Parameter" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "



      - name: deploy-onedata-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ steps.get-parameter.outputs.StackName }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/onedata-pexakey-resources/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: ${{ steps.get-parameter.outputs.Parameter }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"
  
  deploy-onedata-pexakey-resources-data-s3-pst:
    name: PST deploy onedata pexakey S3 resources
    if: (startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: [prod, deploy]
    environment: pst
    outputs:
      Environment: ${{ steps.get-parameter.outputs.Environment }}
      StackName: ${{ steps.get-parameter.outputs.StackName }}
      Parameter: ${{ steps.get-parameter.outputs.Parameter }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
         ls -lrt
          Environment='pst'
          StackName='onedata-pexakey-resources-data-s3'
          Parameter=./cloudformation/parameters/resources-${Environment}/onedata-pexakey-resources/${StackName}.properties

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo "Parameter=$Parameter" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "



      - name: deploy-onedata-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ steps.get-parameter.outputs.StackName }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/onedata-pexakey-resources/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: ${{ steps.get-parameter.outputs.Parameter }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

  deploy-onedata-pexakey-resources-data-s3-prd:
    name: PROD deploy onedata pexakey S3 resources
    if: (startsWith(github.event.pull_request.head.ref, 'release/'))
    needs: [deploy-onedata-pexakey-resources-data-s3-pst]
    runs-on: [prod, deploy]
    environment: prd
    outputs:
      Environment: ${{ steps.get-parameter.outputs.Environment }}
      StackName: ${{ steps.get-parameter.outputs.StackName }}
      Parameter: ${{ steps.get-parameter.outputs.Parameter }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
         ls -lrt
          Environment='prd'
          StackName='onedata-pexakey-resources-data-s3'
          Parameter=./cloudformation/parameters/resources-${Environment}/onedata-pexakey-resources/${StackName}.properties

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo "Parameter=$Parameter" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "



      - name: deploy-onedata-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ steps.get-parameter.outputs.StackName }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/onedata-pexakey-resources/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: ${{ steps.get-parameter.outputs.Parameter }}
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"