name: Deploy-Snowflake-IAM-Role [Core-NP]

on:
  workflow_dispatch:

jobs:
  corenp-dev-onedata-snowflake-egress-role-deploy:
    uses: ./.github/workflows/reusable-snowflake-iam-deploy.yml
    with:
      ApiS3BucketName: "pexa-dev-coreegress-int-store"
      ApiS3BucketKMSKeyID: "fd574f42-f456-4fa0-afff-5f32e18a42bf"
      ExchangeS3BucketName: "onedata-exchange-526552200036-dev"
      ArchiveS3BucketName: "prf02-exchange-archive-data"
      SnowflakePrincipalArn: "arn:aws:iam::178848603211:user/ygr10000-s"
      SnowflakeExternalId: "QN78122_SFCRole=dev_exchange_apilogs_s3_integration"
      SnowflakeExternalIdExchange: "QN78122_SFCRole=dev_exchange_s3_integration"
      RunnerEnvironment: "non-prod"
      Environment: "dev"
      AWSAccountNumber: "526552200036"
      CFTemplate: "cloudformation/templates/snowflake-iam.yml"
      CFStackName: "dev-onedata-snowflake-iam-role"
      GitHubDeployRole: "GitHubRunnerOneDataDeployRole"

  corenp-tst-onedata-snowflake-egress-role-deploy:
