name: Destroy RDS DNS Resolver [Reusable - Terragrunt]

# Workflow trigger(s)
on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to destroy from'
        type: string
        required: true
      runner-type:
        description: 'Type of runner, choose between "prod" or "non-prod"'
        type: string
        required: true
      aws-account:
        description: 'AWS account id'
        required: true
        type: string
      dry-run:
        description: 'Dry run mode (show what would be destroyed)'
        type: boolean
        required: true
        default: true
      auto-approve:
        description: 'Auto-approve destruction (skip confirmation)'
        type: boolean
        required: false
        default: false
      terragrunt-path:
        description: 'Path to Terragrunt configuration'
        type: string
        required: true
    outputs:
      terragrunt-plan-exitcode:
        description: 'Terragrunt plan exit code'
        value: ${{ jobs.destroy-rds-dns-resolver-infra.outputs.plan-exitcode }}
      destruction-status:
        description: 'Overall destruction status'
        value: ${{ jobs.destroy-rds-dns-resolver-infra.outputs.status }}

# GitHub Permissions for the entire workflow
permissions:
  id-token: write
  contents: read

# Jobs
jobs:
  destroy-rds-dns-resolver-infra:
    name: Destroy RDS DNS Resolver Infrastructure
    runs-on: ['${{ inputs.runner-type }}', 'deploy']
    environment: ${{ inputs.environment }}
    container:
      image: '004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/apim-kong-provisioning:latest'
      volumes:
        - /home/github/.ssh/runner_ssh:/root/.ssh/id_rsa
        - /home/github/.ssh/known_hosts:/root/.ssh/known_hosts
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
      status: ${{ steps.status.outputs.result }}
    steps:
      - name: 📋 Destruction Information
        run: |
          echo "## 🗑️ RDS DNS Resolver Infrastructure Destruction" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **AWS Account** | ${{ inputs.aws-account }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Terragrunt Path** | ${{ inputs.terragrunt-path }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runner Type** | ${{ inputs.runner-type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry Run** | ${{ inputs.dry-run }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auto Approve** | ${{ inputs.auto-approve }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tool** | Terragrunt |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account }}:role/GitHubRunnerRdsDnsResolverDeploymentRole
          role-duration-seconds: 900
          role-skip-session-tagging: true
          aws-region: ap-southeast-2

      - name: 🔧 Terragrunt Version
        id: version
        run: |
          terragrunt --version
          terraform version
          echo "terragrunt-version=$(terragrunt --version | head -1)" >> $GITHUB_OUTPUT
          echo "terraform-version=$(terraform version -json | jq -r '.terraform_version')" >> $GITHUB_OUTPUT

      - name: 📍 Verify Terragrunt Path
        working-directory: ${{ inputs.terragrunt-path }}
        shell: bash
        run: |
          echo "Current directory: $(pwd)"
          echo "Terragrunt config file:"
          if [[ -f "terragrunt.hcl" ]]; then
            echo "✅ terragrunt.hcl found"
            head -10 terragrunt.hcl
          else
            echo "❌ terragrunt.hcl not found"
            ls -la
            exit 1
          fi

      - name: 🏗️ Terragrunt Init
        id: init
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "Initializing Terragrunt in: ${{ inputs.terragrunt-path }}"
          terragrunt init
        
      - name: 📋 Terragrunt Plan Destroy
        id: plan
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "Planning destruction with Terragrunt"
          set +e
          terragrunt plan -destroy -detailed-exitcode
          
          PLAN_EXIT_CODE=$?
          echo "exitcode=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT
          
          case $PLAN_EXIT_CODE in
            0)
              echo "✅ No resources to destroy"
              echo "plan-status=no-changes" >> $GITHUB_OUTPUT
              ;;
            1)
              echo "❌ Terragrunt plan destroy failed"
              echo "plan-status=failed" >> $GITHUB_OUTPUT
              exit 1
              ;;
            2)
              echo "📝 Resources will be destroyed"
              echo "plan-status=changes-detected" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❓ Unknown exit code: $PLAN_EXIT_CODE"
              echo "plan-status=unknown" >> $GITHUB_OUTPUT
              exit 1
              ;;
          esac

      - name: 📊 Show Current Resources
        if: steps.plan.outputs.exitcode == '2'
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Current Resources (will be destroyed)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          terragrunt output 2>/dev/null || echo "No outputs available"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: ⏸️ Manual Confirmation Required
        if: |
          !inputs.dry-run && 
          !inputs.auto-approve && 
          steps.plan.outputs.exitcode == '2'
        run: |
          echo "## ⚠️ Manual Confirmation Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**This workflow is configured to require manual confirmation before destroying resources.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To proceed with destruction, re-run this workflow with:" >> $GITHUB_STEP_SUMMARY
          echo "- \`auto-approve\` set to \`true\`" >> $GITHUB_STEP_SUMMARY
          echo "- Or use the \`dry-run\` mode to see what would be destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stopping here to prevent accidental resource destruction.**" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: 🗑️ Terragrunt Destroy
        id: destroy
        if: |
          !inputs.dry-run && 
          inputs.auto-approve && 
          steps.plan.outputs.exitcode == '2'
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "Destroying Terragrunt resources..."
          terragrunt destroy -auto-approve
          echo "✅ Terragrunt destroy completed successfully"

      - name: 🔍 Verify Destruction
        if: steps.destroy.outcome == 'success'
        working-directory: ${{ inputs.terragrunt-path }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Destruction Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Try to show outputs (should be empty after destruction)
          echo "Checking for remaining resources..." >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          terragrunt output 2>/dev/null || echo "No resources remaining (expected after destruction)"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 📈 Set Job Status
        id: status
        if: always()
        run: |
          if [[ "${{ steps.destroy.outcome }}" == "success" ]]; then
            echo "result=destroyed" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.dry-run }}" == "true" ]] && [[ "${{ steps.plan.outcome }}" == "success" ]]; then
            echo "result=dry-run-success" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.plan.outputs.exitcode }}" == "0" ]]; then
            echo "result=no-resources" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.auto-approve }}" == "false" ]] && [[ "${{ steps.plan.outputs.exitcode }}" == "2" ]]; then
            echo "result=confirmation-required" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "Cleaning up workspace..."
          rm -rf "/github/workspace/runners" || true
          # Clean up Terragrunt cache
          find ${{ inputs.terragrunt-path }} -name ".terragrunt-cache" -type d -exec rm -rf {} + 2>/dev/null || true
