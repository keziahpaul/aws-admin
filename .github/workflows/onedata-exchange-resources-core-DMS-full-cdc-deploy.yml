  deploy-onedata-exchange-resources-core-DMS-full-cdc-prd:
    name: deploy-onedata-exchange-resources-core-DMS-full-cdc-prd
    if: (startsWith(github.event.pull_request.head.ref, 'develop'))
    runs-on: [prod, deploy]
    needs: [deploy-onedata-exchange-resources-core-DMS-full-cdc-pst]
    environment: prd
