        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::526552200036:role/GitHubRunnerOneDataDeployRole
          role-duration-seconds: 1800
          role-skip-session-tagging: true
          aws-region: ap-southeast-2

      - name: Terragrunt Plan
        working-directory: terraform/infrastructure/dms-full-cdc/environments/corenp/tst
        run: terragrunt plan

      - name: Terragrunt Apply
        working-directory: terraform/infrastructure/dms-full-cdc/environments/corenp/tst
        run: terragrunt apply -auto-approve

  deploy-onedata-exchange-resources-core-DMS-full-cdc-prf:
    name: deploy-onedata-exchange-resources-core-DMS-full-cdc-prf
    if: startsWith(github.ref ,'refs/heads/feature/prf') && github.event_name == 'push'
    runs-on: [non-prod, deploy]
    environment: prf
    container:
      image: '004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/apim-kong-provisioning:latest'
