name: Deploy-onedata-exchange-resources-core-DMS-full-cdc

on:
  push:
    branches:
      - feature/DD-*
      - feature/prf-*
      - develop
    paths:
      - 'terraform/infrastructure/dms-full-cdc/**'
      - '.github/workflows/onedata-exchange-resources-core-DMS-full-cdc-terragrunt-deploy.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/infrastructure/dms-full-cdc/**'
      - '.github/workflows/onedata-exchange-resources-core-DMS-full-cdc-terragrunt-deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-onedata-exchange-resources-core-DMS-full-cdc-dev:
    name: deploy-onedata-exchange-resources-core-DMS-full-cdc-dev
    if: startsWith(github.ref ,'refs/heads/feature/DD') && github.event_name == 'push'
    runs-on: [non-prod, deploy]
    container:
      image: '004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/apim-kong-provisioning:latest'
      volumes:
        - /home/github/.ssh/runner_ssh:/root/.ssh/id_rsa
        - /home/github/.ssh/known_hosts:/root/.ssh/known_hosts
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::526552200036:role/GitHubRunnerOneDataDeployRole
          role-duration-seconds: 1800
          role-skip-session-tagging: true
          aws-region: ap-southeast-2

      - name: Terragrunt Plan
        working-directory: terraform/infrastructure/dms-full-cdc/environments/corenp/dev
        run: terragrunt plan

      - name: Terragrunt Apply
        working-directory: terraform/infrastructure/dms-full-cdc/environments/corenp/dev
        run: terragrunt apply -auto-approve

  deploy-onedata-exchange-resources-core-DMS-full-cdc-tst:
    name: deploy-onedata-exchange-resources-core-DMS-full-cdc-tst
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: [non-prod, deploy]
    container:
      image: '004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/apim-kong-provisioning:latest'
      volumes:
        - /home/github/.ssh/runner_ssh:/root/.ssh/id_rsa
        - /home/github/.ssh/known_hosts:/root/.ssh/known_hosts
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

