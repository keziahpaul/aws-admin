name: Deploy Agent Platform

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Validate: read accounts config and resolve IDs for each environment
  # ------------------------------------------------------------------
  validate:
    name: Validate Configuration
    runs-on: ['non-prod', 'deploy']
    outputs:
      datanp-account-id: ${{ steps.config.outputs.datanp-account-id }}
      datanp-runner-type: ${{ steps.config.outputs.datanp-runner-type }}
      dataprd-account-id: ${{ steps.config.outputs.dataprd-account-id }}
      dataprd-runner-type: ${{ steps.config.outputs.dataprd-runner-type }}
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v5

      - name: 🔍 Load & Validate Configuration
        id: config
        run: |
          CONFIG_FILE=".github/config/agent-platform-accounts.json"

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "❌ Configuration file not found: $CONFIG_FILE"
            exit 1
          fi

          # datanp
          DATANP_ACCOUNT_ID=$(jq -r '.datanp.account_id' "$CONFIG_FILE")
          DATANP_RUNNER_TYPE=$(jq -r '.datanp.runner_type' "$CONFIG_FILE")

          # dataprd
          DATAPRD_ACCOUNT_ID=$(jq -r '.dataprd.account_id' "$CONFIG_FILE")
          DATAPRD_RUNNER_TYPE=$(jq -r '.dataprd.runner_type' "$CONFIG_FILE")

          echo "datanp-account-id=$DATANP_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "datanp-runner-type=$DATANP_RUNNER_TYPE" >> $GITHUB_OUTPUT
          echo "dataprd-account-id=$DATAPRD_ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "dataprd-runner-type=$DATAPRD_RUNNER_TYPE" >> $GITHUB_OUTPUT

          echo "## 📋 Agent Platform Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Account | ID | Runner Type |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| datanp  | $DATANP_ACCOUNT_ID | $DATANP_RUNNER_TYPE |" >> $GITHUB_STEP_SUMMARY
          echo "| dataprd | $DATAPRD_ACCOUNT_ID | $DATAPRD_RUNNER_TYPE |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Configuration loaded successfully"

  # ------------------------------------------------------------------
  # dev: feature/* branches -> datanp
  # ------------------------------------------------------------------
  deploy-dev:
    name: Deploy dev (datanp)
    needs: [validate]
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/feature/')
    uses: ./.github/workflows/reusable-agent-platform-deploy.yml
    with:
      environment: dev
      runner-type: ${{ needs.validate.outputs.datanp-runner-type }}
      aws-account: ${{ needs.validate.outputs.datanp-account-id }}
      terragrunt-path: terraform/infrastructure/agent-platform/environments/datanp/dev

  # ------------------------------------------------------------------
  # tst: develop branch -> datanp
  # ------------------------------------------------------------------
  deploy-tst:
    name: Deploy tst (datanp)
    needs: [validate]
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable-agent-platform-deploy.yml
    with:
      environment: tst
      runner-type: ${{ needs.validate.outputs.datanp-runner-type }}
      aws-account: ${{ needs.validate.outputs.datanp-account-id }}
      terragrunt-path: terraform/infrastructure/agent-platform/environments/datanp/tst

  # ------------------------------------------------------------------
  # pst: main or release/* -> dataprd
  # ------------------------------------------------------------------
  deploy-pst:
    name: Deploy pst (dataprd)
    needs: [validate]
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/reusable-agent-platform-deploy.yml
    with:
      environment: pst
      runner-type: ${{ needs.validate.outputs.dataprd-runner-type }}
      aws-account: ${{ needs.validate.outputs.dataprd-account-id }}
      terragrunt-path: terraform/infrastructure/agent-platform/environments/dataprd/pst

  # ------------------------------------------------------------------
  # prd: main or release/* -> dataprd (after pst succeeds)
  # ------------------------------------------------------------------
  deploy-prd:
    name: Deploy prd (dataprd)
    needs: [validate, deploy-pst]
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/reusable-agent-platform-deploy.yml
    with:
      environment: prd
      runner-type: ${{ needs.validate.outputs.dataprd-runner-type }}
      aws-account: ${{ needs.validate.outputs.dataprd-account-id }}
      terragrunt-path: terraform/infrastructure/agent-platform/environments/dataprd/prd
