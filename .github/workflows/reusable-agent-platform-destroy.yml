name: Destroy Agent Platform Agent [Reusable - Terragrunt]

# Reusable workflow that destroys a SINGLE agent's resources from the shared
# agent-platform stack via a targeted terragrunt destroy. Safe by default:
# dry-run shows the destroy plan; nothing is destroyed unless auto-approve is
# explicitly set to true. Uses GitHub Environment protection for approval.

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to destroy from'
        type: string
        required: true
      runner-type:
        description: 'Runner type: prod or non-prod'
        type: string
        required: true
      aws-account:
        description: 'AWS account id'
        type: string
        required: true
      terragrunt-path:
        description: 'Path to the environment terragrunt configuration'
        type: string
        required: true
      agent:
        description: 'Name of the agent to destroy (e.g. aira)'
        type: string
        required: true
      dry-run:
        description: 'Dry run mode (show what would be destroyed)'
        type: boolean
        required: true
        default: true
      auto-approve:
        description: 'Auto-approve destruction (skip confirmation)'
        type: boolean
        required: false
        default: false
    outputs:
      destruction-status:
        description: 'Overall destruction status'
        value: ${{ jobs.destroy-agent.outputs.status }}

permissions:
  id-token: write
  contents: read

jobs:
  destroy-agent:
    name: Destroy agent "${{ inputs.agent }}" (${{ inputs.environment }})
    runs-on: ['${{ inputs.runner-type }}', 'deploy']
    environment: ${{ inputs.environment }}
    container:
      image: '004761221582.dkr.ecr.ap-southeast-2.amazonaws.com/apim-kong-provisioning:latest'
      volumes:
        - /home/github/.ssh/runner_ssh:/root/.ssh/id_rsa
        - /home/github/.ssh/known_hosts:/root/.ssh/known_hosts
    outputs:
      status: ${{ steps.status.outputs.result }}
    steps:
      - name: 📋 Destruction Information
        run: |
          echo "## 🗑️ Agent Platform - Destroy Agent" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent** | ${{ inputs.agent }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **AWS Account** | ${{ inputs.aws-account }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Terragrunt Path** | ${{ inputs.terragrunt-path }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry Run** | ${{ inputs.dry-run }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auto Approve** | ${{ inputs.auto-approve }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 📥 Checkout Source Code
        uses: actions/checkout@v5

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account }}:role/GitHubRunnerAgentPlatformDeploymentRole
          role-duration-seconds: 3600
          role-skip-session-tagging: true
          aws-region: ap-southeast-2

      - name: 🔧 Terragrunt Version
        run: |
          terragrunt --version
          terraform version

      - name: 📍 Verify Terragrunt Path & Agent Config
        working-directory: ${{ inputs.terragrunt-path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "terragrunt.hcl" ]]; then
            echo "❌ terragrunt.hcl not found in ${{ inputs.terragrunt-path }}"
            ls -la
            exit 1
          fi
          if [[ ! -f "agents/${{ inputs.agent }}.hcl" ]]; then
            echo "❌ Agent config agents/${{ inputs.agent }}.hcl not found."
            echo "Available agents:"
            ls agents/ 2>/dev/null || echo "  (none)"
            exit 1
          fi
          echo "✅ Found agents/${{ inputs.agent }}.hcl"

      - name: 🏗️ Terragrunt Init
        working-directory: ${{ inputs.terragrunt-path }}
        run: terragrunt init

      # Build the -target list for every module keyed by the agent. Targeting
      # by the agent's for_each key destroys ONLY that agent's resources and
      # leaves other agents (e.g. pia) untouched.
      - name: 🎯 Build agent target list
        id: targets
        working-directory: ${{ inputs.terragrunt-path }}
        shell: bash
        run: |
          set -euo pipefail
          AGENT='${{ inputs.agent }}'
          MODULES=(agent_runtime ecs_service bedrock_kb agent_memory agent_gateway agent_scheduler iam observability secrets s3_kb_bucket)
          TARGETS=""
          for m in "${MODULES[@]}"; do
            addr="module.${m}[\"${AGENT}\"]"
            # Only target modules that actually have state entries for this agent.
            if terragrunt state list 2>/dev/null | grep -q "^module.${m}\[\\\"${AGENT}\\\"\]"; then
              TARGETS="${TARGETS} -target=${addr}"
            fi
          done
          if [[ -z "$TARGETS" ]]; then
            echo "No state entries found for agent '$AGENT'; nothing to destroy."
            echo "has-targets=false" >> $GITHUB_OUTPUT
          else
            echo "has-targets=true" >> $GITHUB_OUTPUT
          fi
          echo "targets=${TARGETS}" >> $GITHUB_OUTPUT
          echo "Targets: ${TARGETS:-<none>}"

      - name: 📋 Terragrunt Plan Destroy (targeted)
        id: plan
        if: steps.targets.outputs.has-targets == 'true'
        working-directory: ${{ inputs.terragrunt-path }}
        shell: bash
        run: |
          set +e
          terragrunt plan -destroy ${{ steps.targets.outputs.targets }} -detailed-exitcode
          PLAN_EXIT_CODE=$?
          echo "exitcode=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT
          case $PLAN_EXIT_CODE in
            0) echo "✅ No resources to destroy" ;;
            1) echo "❌ Plan destroy failed"; exit 1 ;;
            2) echo "📝 Resources will be destroyed" ;;
            *) echo "❓ Unknown exit code: $PLAN_EXIT_CODE"; exit 1 ;;
          esac

      - name: ⏸️ Manual Confirmation Required
        if: |
          !inputs.dry-run &&
          !inputs.auto-approve &&
          steps.plan.outputs.exitcode == '2'
        run: |
          echo "## ⚠️ Manual Confirmation Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Re-run with **auto-approve = true** to actually destroy agent '${{ inputs.agent }}'." >> $GITHUB_STEP_SUMMARY
          echo "Stopping here to prevent accidental destruction." >> $GITHUB_STEP_SUMMARY

      - name: 🗑️ Terragrunt Destroy (targeted)
        id: destroy
        if: |
          !inputs.dry-run &&
          inputs.auto-approve &&
          steps.plan.outputs.exitcode == '2'
        working-directory: ${{ inputs.terragrunt-path }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Destroying agent '${{ inputs.agent }}' resources..."
          terragrunt destroy -auto-approve ${{ steps.targets.outputs.targets }}
          echo "✅ Destroy completed."

      # AIRA-style secrets have a recovery window; a follow-up recreate within
      # that window fails because the name is pending deletion. Force-delete the
      # agent's created secrets so the stack can be recreated immediately.
      - name: 🧨 Force-delete agent secrets (post-destroy)
        if: steps.destroy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="${{ inputs.environment }}/${{ inputs.agent }}-agent/"
          echo "Scanning for secrets under $PREFIX ..."
          ARNS=$(aws secretsmanager list-secrets \
            --region ap-southeast-2 \
            --filters Key=name,Values="$PREFIX" \
            --query 'SecretList[].ARN' --output text 2>/dev/null || true)
          if [[ -z "$ARNS" ]]; then
            echo "No lingering secrets found under $PREFIX."
          else
            for arn in $ARNS; do
              echo "Force-deleting $arn"
              aws secretsmanager delete-secret --secret-id "$arn" \
                --force-delete-without-recovery --region ap-southeast-2 >/dev/null || \
                echo "  (already gone or delete failed for $arn)"
            done
          fi

      - name: 📈 Set Job Status
        id: status
        if: always()
        run: |
          if [[ "${{ steps.destroy.outcome }}" == "success" ]]; then
            echo "result=destroyed" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.dry-run }}" == "true" ]] && [[ "${{ steps.plan.outcome }}" == "success" ]]; then
            echo "result=dry-run-success" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.targets.outputs.has-targets }}" == "false" ]]; then
            echo "result=no-resources" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.auto-approve }}" == "false" ]] && [[ "${{ steps.plan.outputs.exitcode }}" == "2" ]]; then
            echo "result=confirmation-required" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi

      - name: 🧹 Cleanup
        if: always()
        run: |
          find ${{ inputs.terragrunt-path }} -name ".terragrunt-cache" -type d -exec rm -rf {} + 2>/dev/null || true
