name: Deploy-onedata-ingress-s3-resources ( should be the first workflow to run before other workflows in salesforce stack. This creates ingress s3 bucket)
on:
  push:
    branches:
      - feature/DD-*
      - develop
    paths:
      - 'cloudformation/parameters/resources-dev/onedata-salesforce-resources/onedata-ingress-s3-params.properties'
      - 'cloudformation/parameters/resources-tst/onedata-salesforce-resources/onedata-ingress-s3-params.properties'
      - '.github/workflows/onedata-salesforce-resources-ingress-s3-deploy.yml'
      - 'cloudformation/templates/onedata-salesforce-resources/onedata-ingress-s3.yml'
  
  pull_request:
    branches:
      - main
    paths:
      - 'cloudformation/parameters/resources-pst/onedata-salesforce-resources/onedata-ingress-s3-params.properties'
      - 'cloudformation/parameters/resources-prd/onedata-salesforce-resources/onedata-ingress-s3-params.properties'
      - '.github/workflows/onedata-salesforce-resources-ingress-s3-deploy.yml'
      - 'cloudformation/templates/onedata-salesforce-resources/onedata-ingress-s3.yml'
  
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout


jobs:
  deploy-onedata-ingress-s3-dev:
    name: DEV deploy onedata ingress S3 resource
    if: startsWith(github.ref ,'refs/heads/feature/DD') && github.event_name == 'push' 
    runs-on: [non-prod, deploy]
    outputs:
      Environment: ${{ steps.get-parameter.outputs.Environment }}
      StackName: ${{ steps.get-parameter.outputs.StackName }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
         ls -lrt
          Environment='dev'
          StackName='onedata-ingress-s3'
          
          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo " Environment: $Environment "

      - name: deploy-ingress-s3-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ steps.get-parameter.outputs.StackName }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/onedata-salesforce-resources/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: "cloudformation/parameters/resources-${{ steps.get-parameter.outputs.Environment }}/onedata-salesforce-resources/${{ steps.get-parameter.outputs.StackName }}-params.properties"
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"
  
  deploy-onedata-ingress-s3-tst:
    name: TST deploy onedata ingress S3 resource
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push' 
    runs-on: [non-prod, deploy]
    outputs:
      Environment: ${{ steps.get-parameter.outputs.Environment }}
      StackName: ${{ steps.get-parameter.outputs.StackName }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
         ls -lrt
          Environment='tst'
          StackName='onedata-ingress-s3'

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "

      - name: deploy-ingress-s3-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ steps.get-parameter.outputs.StackName }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/onedata-salesforce-resources/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: "cloudformation/parameters/resources-${{ steps.get-parameter.outputs.Environment }}/onedata-salesforce-resources/${{ steps.get-parameter.outputs.StackName }}-params.properties"
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"
  
  deploy-onedata-ingress-s3-pst:
    name: PST deploy onedata ingress S3 resource
    if: (startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: [prod, deploy]
    environment: pst
    outputs:
      Environment: ${{ steps.get-parameter.outputs.Environment }}
      StackName: ${{ steps.get-parameter.outputs.StackName }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
         ls -lrt
          Environment='pst'
          StackName='onedata-ingress-s3'

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT

          echo " Environment: $Environment "

      - name: deploy-ingress-s3-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ steps.get-parameter.outputs.StackName }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/onedata-salesforce-resources/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: "cloudformation/parameters/resources-${{ steps.get-parameter.outputs.Environment }}/onedata-salesforce-resources/${{ steps.get-parameter.outputs.StackName }}-params.properties"
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"

  deploy-onedata-ingress-s3-prd:
    name: PROD deploy onedata ingress S3 resource
    if: (startsWith(github.event.pull_request.head.ref, 'release/'))
    needs: [deploy-onedata-ingress-s3-pst]
    runs-on: [prod, deploy]
    environment: prd
    outputs:
      Environment: ${{ steps.get-parameter.outputs.Environment }}
      StackName: ${{ steps.get-parameter.outputs.StackName }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Get Parameters
        id: get-parameter
        env:
          parameter_env: ${{ github.ref_name }}
        run: |
         ls -lrt
          Environment='prd'
          StackName='onedata-ingress-s3'

          echo "Environment=$Environment" >> $GITHUB_OUTPUT
          echo "StackName=$StackName" >> $GITHUB_OUTPUT
          echo " Environment: $Environment "

      - name: deploy-ingress-s3-resources
        uses: ./.github/actions/onedata-resource-deploy
        with:
          Stack: "${{ steps.get-parameter.outputs.StackName }}-${{ steps.get-parameter.outputs.Environment }}"
          template: "cloudformation/templates/onedata-salesforce-resources/${{ steps.get-parameter.outputs.StackName }}.yml"
          Environment: ${{ steps.get-parameter.outputs.Environment }}
          ParameterPath: "cloudformation/parameters/resources-${{ steps.get-parameter.outputs.Environment }}/onedata-salesforce-resources/${{ steps.get-parameter.outputs.StackName }}-params.properties"
          Capability: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"