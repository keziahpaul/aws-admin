name: 'deploys3'
description: 'Action for deploying Cloudformation stacks and ETL artifactss'

inputs:

  Stack:
    description: 'Cloudformation stack name'
    required: true

  Template:
    description: 'Name of Cloudformation template file including path'
    required: true

  ParameterPath:
    description: 'Path to the parameter file including file name'
    required: true
    type: string

  Environment:
    description: 'template environment'
    required: true

  AWS_Region:
    description: 'AWS REGION'
    required: false
    default: 'ap-southeast-2'

  role-timeout:
    description: 'IAM ASSUME ROLE TIMEOUT'
    required: false
    default: '1800'

  Capability:
    description:  'The the capability that mentions teh components deployed, comma seperated if there are multiple types eg: CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND  '
    required: true
    type: string

  GitHubDeploy_IAM_ROLE:
    description: 'The IAM role used to deploy AWS components'
    required: true
    type: string
    default: 'GitHubRunnerPEXAOneDataRole'

runs:
  using: "composite"
  steps:

    - name: get Account number from Parameter
      id: get-account
      shell: bash
      run: |
          echo "Fetching account number from parameter"
          Account=`awk '/^Account=/' ${{ inputs.ParameterPath }} | sed 's/Account=//'`
          echo "AWSAccountNumber=$Account" >> $GITHUB_OUTPUT
          echo "AWSAccount: $Account  "

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::${{ steps.get-account.outputs.AWSAccountNumber }}:role/${{ inputs.GitHubDeploy_IAM_ROLE }}
        role-duration-seconds: ${{ inputs.role-timeout }}
        role-skip-session-tagging: true
        aws-region: ${{ inputs.AWS_REGION }}

    - name: Validate Cloudformation Template
      id: Validate-Cloudformation-Template
      shell: bash
      run: |
          aws cloudformation validate-template --template-body file://${{ inputs.Template }} --region ap-southeast-2

    - name: Extract Parameter
      id: extract-param
      shell: bash
      run: |
          # Replace GitSha placeholder with actual value if it exists in the file
          if [ -f "${{ inputs.ParameterPath }}" ] && grep -q "GitSha={{GitSha}}" "${{ inputs.ParameterPath }}"; then
            SHORT_SHA=$(echo "${{github.sha}}" | cut -b -7 )
            sed -i "s/GitSha={{GitSha}}/GitSha=${SHORT_SHA}/g" "${{ inputs.ParameterPath }}"
          fi
          parameter=$(cat ${{ inputs.ParameterPath }}|tr -s '\n' '\n'|sed '$ ! s/$/,/')
          parameter=${parameter//$'\n'/ }
          echo "parameter=${parameter//$'\r'/ }" >> $GITHUB_OUTPUT
          echo  $parameter

    - name: Deploy Cloudformation Stack
      uses: PEXA-AU/aws-cloudformation-github-deploy@2.0.0
      with:
        name: ${{ inputs.Stack }}
        template: ${{ inputs.Template }}
        capabilities: ${{ inputs.Capability }}
        no-fail-on-empty-changeset: '1'
        tail-events: "1"
        event-timezone: "Australia/Melbourne"
        parameter-overrides: ${{ steps.extract-param.outputs.parameter }}