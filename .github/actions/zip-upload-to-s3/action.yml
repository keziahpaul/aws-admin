name: Zip and Upload Lambda to S3
description: Reusable step to zip and upload a Lambda function to S3 - includes PyZipper Layer

inputs:
  s3_util_shared_bucket:
    description: Shared bucket name for utility functions
    required: true

runs:
  using: "composite"
  steps:
    - name: Zip and push required packages for lambda layer
      shell: bash
      run: |
        # Get the short SHA for this build
        SHORT_SHA=$(echo ${{ github.sha }} | cut -b -7 )
        
        tmp=$(mktemp -d)
        mkdir ${tmp}/python
        pip3 install --platform manylinux2014_x86_64 --target ${tmp}/python --python-version 3.12 --only-binary=:all: -r lambda/requirements.txt
        pushd ${tmp}
        zip -r pyzipper-layer.zip python
        aws s3 cp pyzipper-layer.zip s3://${{ inputs.s3_util_shared_bucket }}/bespoke_report/${SHORT_SHA}/pyzipper-layer.zip --region ap-southeast-2
        popd
        rm -rf ${tmp}

    - name: Zip and Push Bespoke Lambda Function
      id: zip-upload
      shell: bash
      run: |
        # Get the short SHA for this build
        SHORT_SHA=$(echo ${{ github.sha }} | cut -b -7 )
        NEW_KEY="bespoke_report/$SHORT_SHA/bespoke_report_extract_lambda.zip"

        echo "NEW_KEY: $NEW_KEY"

        # Create the new zip file
        zip -j bespoke_report_extract_lambda.zip lambda/bespoke_report_extract_lambda.py

        # Debug: show the zip file
        ls -l bespoke_report_extract_lambda.zip
        echo "Uploading to: s3://${{ inputs.s3_util_shared_bucket }}/$NEW_KEY"

        # Upload the new zip file to S3
        aws s3 cp bespoke_report_extract_lambda.zip s3://${{ inputs.s3_util_shared_bucket }}/$NEW_KEY

        echo "lambda_zip=$NEW_KEY" >> $GITHUB_OUTPUT

outputs:
  lambda_zip:
    description: The S3 key where the zipped Lambda function is stored
    value: ${{ steps.zip-upload.outputs.lambda_zip }}