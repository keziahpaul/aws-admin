---
name: Parse CloudFormation Parameters
description: This GitHub action is for parsing templated params file.
inputs:
  parameters:
    description: Path to the CloudFormation parameters file
    required: false
  data-string:
    description: JSON string of data to be used for templating
    required: false
outputs:
  output-file:
    description: Path to the parsed CloudFormation parameters file
    value: ${{ steps.print-parameters.outputs.file }}

runs:
  using: composite
  steps:        
    # Parse CloudFormation parameters from templated json file
    - name: Parse CloudFormation Parameters
      if: ${{ inputs.data-string != '' }}
      uses: PEXA-AU/jinja-render-action@1.2.3
      with:
        template-file: ${{ inputs.parameters }}
        data-string: ${{ inputs.data-string }}
        output-file: ./connector-profile-params-parsed.json
        strict: true
    
    # Print parsed CloudFormation parameters
    - name: Print CloudFormation Parameters
      id: print-parameters
      shell: bash
      run: |
        # Print parsed CloudFormation parameters
        cat ./connector-profile-params-parsed.json
        echo "file=connector-profile-params-parsed.json" >> $GITHUB_OUTPUT