---
name: Deploy Stack
description: This GitHub action is for deploying CloudFormation stacks.
inputs:
  stack-name:
    description: Name of the CloudFormation stack
    required: true
  template:
    description: Path to the CloudFormation template
    required: true
  parameters:
    description: Path to the CloudFormation parameters file
    required: false
  no-execute-changeset:
    description: Indicates whether to execute to the change set or have it reviewed (true or false)
    required: false
    default: false

runs:
  using: composite
  steps:
    # Parse CloudFormation changeset execution option
    - name: Parse CloudFormation Changeset Execution
      id: parse-changeset-execution
      shell: bash
      run: |
        # Parse CloudFormation Changeset Execution
        if [[ ${{ inputs.no-execute-changeset }} == "true" ]]; then
          echo "no-execute-changeset=1" >> $GITHUB_OUTPUT
        elif [[ ${{ inputs.no-execute-changeset }} == "false" ]]; then
          echo "no-execute-changeset=0" >> $GITHUB_OUTPUT
        else
          echo "no-execute-changeset must be set to true or false"
          exit -1
        fi

    # Deploy stack to CloudFormation
    - name: Deploy CloudFormation Stack
      uses: PEXA-AU/aws-cloudformation-github-deploy@1.2.0
      with:
        name: ${{ inputs.stack-name }}
        template: ${{ inputs.template }}
        capabilities: 'CAPABILITY_NAMED_IAM'
        no-fail-on-empty-changeset: "1"
        parameter-overrides: ${{ inputs.parameters }}
        no-execute-changeset: ${{ steps.parse-changeset-execution.outputs.no-execute-changeset }}
        tail-events: "1"
        event-timezone: "Australia/Melbourne"
    
    # Create a workflow summary and send to GitHub
    - name: Create Deployment Summary
      shell: bash
      run: |
        # Deployment Summary
        echo "**Triggered by**:   $GITHUB_TRIGGERING_ACTOR" >> $GITHUB_STEP_SUMMARY
        echo "**Completed**:      $(date +'%d %b %Y, %T')" >> $GITHUB_STEP_SUMMARY
        echo "**Stack Name**:     ${{ inputs.stack-name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Template**:       ${{ inputs.template }}" >> $GITHUB_STEP_SUMMARY
        echo "**Parameters**:     ${{ inputs.parameters }}" >> $GITHUB_STEP_SUMMARY
        echo "**Dry Run Mode**:   ${{ inputs.no-execute-changeset }}" >> $GITHUB_STEP_SUMMARY
        echo "**Version**:        ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY