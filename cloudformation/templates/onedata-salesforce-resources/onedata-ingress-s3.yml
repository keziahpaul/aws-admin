AWSTemplateFormatVersion: '2010-09-09'
# Transform: AWS::Serverless-2016-10-31

Description: >
  pexa-one-data-aws-admin

Parameters:
  Environment:
    Type: String
  Account:
    Type: String


Resources:
  
  PexaIngressS3:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub onedata-ingress-${AWS::AccountId}-${Environment}
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption: 
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt PexaIngressKMSCMK.Arn
            BucketKeyEnabled: true

  PexaIngressS3BucketPolicy: 
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PexaIngressS3
      PolicyDocument:
        Statement:
          - Action:
              - s3:GetObject
              - s3:DeleteObject
              - s3:List*
            Effect: Deny
            Resource: 
              - !Sub 'arn:aws:s3:::${PexaIngressS3}/*'
              - !Sub 'arn:aws:s3:::${PexaIngressS3}'
            Principal: '*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: [ 
                  !Sub 'arn:aws:iam::${AWS::AccountId}:role/onedata*${Environment}',
                  !Sub 'arn:aws:iam::${AWS::AccountId}:role/onedata-ingestion-validation-${Environment}-role',
                  !Sub 'arn:aws:iam::${AWS::AccountId}:role/GitHubRunnerPEXAOneDataRole'
                ]
          - Action:
              - s3:AbortMultipartUpload
              - s3:GetBucketAcl
              - s3:GetObject
              - s3:ListBucket
              - s3:ListBucketMultipartUploads
              - s3:ListMultipartUploadParts
              - s3:PutObject
              - s3:PutObjectAcl
            Effect: Allow
            Resource: 
              - !Sub 'arn:aws:s3:::${PexaIngressS3}/*'
              - !Sub 'arn:aws:s3:::${PexaIngressS3}'
            Principal: 
              Service: appflow.amazonaws.com



  PexaIngressKMSCMK:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS CMK for PEXA ingress data storage
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Id: key-default-1
        Statement:
          - Sid: Allow root access
            Action:
              - kms:*
            Effect: Allow
            Resource: '*'
            Principal: 
              AWS: 
                - !Sub 'arn:aws:iam::${AWS::AccountId}:root'

          - Sid: Allow access for Appflow for all principals in the account
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
              - kms:Encrypt
              - kms:ReEncrypt*
            Effect: Allow
            Principal:
              AWS: '*'
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount: !Sub '${AWS::AccountId}'
                kms:ViaService: !Sub 'appflow.${AWS::Region}.amazonaws.com'
          
          - Sid: Allow access for Key Admins
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:Decrypt
              - kms:GenerateDataKey*
            Effect: Allow
            Principal:
              AWS:
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/GitHubRunnerSalesforceAppFlowRole'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/GitHubRunnerPEXAOneDataRole'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/onedata-s3-ingress-snowflake-integration-role-${Environment}'
            Resource: '*'

          
          - Sid: Allow access through AWS Secrets Manager for all principals in the account that are authorized to use AWS Secrets Manager
            Action: 
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:CreateGrant
              - kms:DescribeKey
              - kms:GenerateDataKey*
            Effect: Allow
            Principal:
              AWS: '*'
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount: !Sub '${AWS::AccountId}'
                kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
      Tags:
        - Key: environment
          Value: !Sub ${AWS::AccountId}
        - Key: team
          Value: onedata-ingress


  PexaIngressKMSCMKAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/onedata-ingress-${AWS::AccountId}-${Environment}
      TargetKeyId: !Ref PexaIngressKMSCMK

       
       


  
  
Outputs:
  PexaIngressS3BucketName:
    Description: S3 bucket name
    Value: !Ref PexaIngressS3
    Export:
      Name: !Sub "${AWS::StackName}:onedata-ingress-bucket-name"
  PexaIngressKMSKeyId:
    Value: !Ref PexaIngressKMSCMK
    Export:
      Name: !Sub ${AWS::StackName}:onedata-ingress-kms-key-id
  PexaIngressKMSAlias:
    Value: !Ref PexaIngressKMSCMKAlias
    Export:
      Name: !Sub ${AWS::StackName}:onedata-ingress-kms-key-alias
  PexaIngressKMSArn:
    Value: !GetAtt PexaIngressKMSCMK.Arn
    Export:
      Name: !Sub ${AWS::StackName}:onedata-ingress-kms-key-arn