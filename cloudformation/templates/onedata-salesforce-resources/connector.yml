---
## Environment: UAT
## AWS Account: DATA NONPROD
## Deploy this template before deploying or updating the AppFlow Flows
## Stack Name Format: pexa-salesforce-dataflow-dev-connector-profile-dd-mmm-yyyy
## Post Deployment: Configure the Flows to use the new connector profile once created
## Post Deployment: Delete the old/previous connector profile stack to clean up its resources

AWSTemplateFormatVersion: '2010-09-09'
Description: Template to create the connector profile to authorise Appflow and Salesforce API

Parameters:
  ConnectorType:
    Type: String
    Description: The type of connector, such as Salesforce, Marketo etc
    Default: Salesforce
  ConnectionMode:
    Type: String
    Description: Indicates the connection mode and if it is public or private. Salesforce works with Public connection mode
    Default: Public
    AllowedValues: [Public, Private]
  Environment:
    Type: String
    Description: Specify the environment from the allowed values
    Default: dev
    AllowedValues: [dev, tst, pst, prd]
  KMSArn:
    Type: String
    Description: The ARN (Amazon Resource Name) of the KMS (Key Management Service) key you provide for encryption
    Default: "arn:aws:kms:ap-southeast-2:042775015153:key/0253a359-aaca-4a60-a1a6-8d025549ff42"
  ClientCredentialsArn:
    Type: String
    Description: The secret manager ARN, which contains the client ID and client secret of the connected app. Client ID and secret can be genearated from the Salesforce connected app
    NoEcho: true
    Default: "arn:aws:secretsmanager:ap-southeast-2:042775015153:secret:salesforce_nonprod-KxbORu" # Secret name: salesforce_nonprod
  SandboxFlag:
    Type: String
    AllowedValues: [true, false]
    Description: Use true for nonprod and false for prod
    Default: true
  InstanceURL:
    Type: String
    Description: Salesforce URL
    Default: "https://pexa--uat.sandbox.my.salesforce.com"
  ConnectorProfileName:
    Type: String
    Description: The name of the connector profile. The name is unique for each ConnectorProfile in the AWS account 
  SecretName:
    Type: String
    Description: The name of the secret that stores access token and refresh token

Resources:
  ConnectorProfile:
    Type: AWS::AppFlow::ConnectorProfile
    Properties:
      ConnectionMode: !Ref ConnectionMode
      ConnectorProfileConfig:
        ConnectorProfileCredentials:
          Salesforce:
            ClientCredentialsArn: !Ref ClientCredentialsArn
            AccessToken: !Sub "{{resolve:secretsmanager:${SecretName}:SecretString:AccessToken}}" # provided by the Salesforce team
            RefreshToken: !Sub "{{resolve:secretsmanager:${SecretName}:SecretString:RefreshToken}}" # provided by the Salesforce team
        ConnectorProfileProperties:
          Salesforce:
            instanceUrl: !Ref InstanceURL
            isSandboxEnvironment: !Ref SandboxFlag
      ConnectorProfileName: !Ref ConnectorProfileName
      ConnectorType: !Ref ConnectorType
      KMSArn: 
        Fn::ImportValue: !Ref KMSArn

Outputs:
  ConnectorProfileArn:
    Description: The ARN of the connector profile
    Value: !GetAtt ConnectorProfile.ConnectorProfileArn
    Export:
      Name: !Sub "${AWS::StackName}-ConnectorProfileArn"