AWSTemplateFormatVersion: '2010-09-09'

Description: >
  cloud formation template for onedata pxi resources

Parameters:
  DeployEnv:
    Type: String
  Environment:
    Type: String
  Account:
    Type: String
  SnowflakePrincipalArn:
    Type: String
    Description: "Snowflake Account ID"
  SnowflakeExternalId:
    Type: String
    Description: "Snowflake External ID"

Resources:
  # secret for accessing hibob api
  OneDataPxiHibobApiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub one_data_snowflake_${Environment}_hibob_credentials
      Description: Secret for accessing hibob api
      Tags:
        - Key: environment
          Value: !Sub ${Environment}
        - Key: team
          Value: onedata   

    # secret for accessing lever api
  OneDataPxiLeverApiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub one_data_snowflake_${Environment}_lever_credentials
      Description: Secret for accessing lever api
      Tags:
        - Key: environment
          Value: !Sub ${Environment}
        - Key: team
          Value: onedata     

    # secret for accessing lever api
  OneDataPxiLitmosApiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub one_data_snowflake_${Environment}_litmos_credentials
      Description: Secret for accessing litmos api
      Tags:
        - Key: environment
          Value: !Sub ${Environment}
        - Key: team
          Value: onedata   
    
  IAMRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain 
    Properties:
      RoleName: !Sub "onedata-px-snowflake-integration-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              AWS: !Ref SnowflakePrincipalArn
            Action:
              - "sts:AssumeRole"
            Condition:
              StringEquals:
                sts:ExternalId: [
                  !Ref SnowflakeExternalId
                ]
      Path: "/"
      Policies:
        - 
          PolicyName: "onedata-px-snowflake-integration-role-secret-management-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: "Allow"
              Action:
                - "secretsmanager:GetSecretValue"
                - "secretsmanager:DescribeSecret"
              Resource: 
                - !Ref OneDataPxiHibobApiSecret
                - !Ref OneDataPxiLeverApiSecret
                - !Ref OneDataPxiLitmosApiSecret