            rule-id: '2'
            rule-name: 'api_usage_audit_trn_seq'
            rule-target: column
            object-locator:
              schema-name: public
              table-name: api_usage_audit
            rule-action: add-column
            value: 'transact_id'
            expression: '$AR_H_CHANGE_SEQ'
            data-type:
              type: string
              length: 50
          - rule-type: selection
            rule-action: include
            rule-id: '3'
            rule-name: 'authority'
