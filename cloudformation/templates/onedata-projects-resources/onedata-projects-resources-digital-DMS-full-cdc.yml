AWSTemplateFormatVersion: '2010-09-09'

Description: >
  DMS Serverless Task for Full and CDC Load in Digital Account 

Parameters:
  Environment:
    Type: String
  Account:
    Type: String
  OnedataAccount:
    Type: String
  MinDCU:
    Type: Number
  MaxDCU:
    Type: Number
  DMSSubnetGroup:
    Type: String
  DMSKMS:
    Type: String

Resources:
  OnedataProjectsDMSServerlessfullcdc:
    Type: AWS::DMS::ReplicationConfig
    Properties:
      ComputeConfig: 
        MultiAZ: true
        MinCapacityUnits: !Ref MinDCU
        MaxCapacityUnits: !Ref MaxDCU
        PreferredMaintenanceWindow: Sun:11:00-Sun:13:00
        ReplicationSubnetGroupId: 
          Fn::ImportValue:
            Fn::Sub: 'onedata-projects-resources-digital-DMS-components-${Environment}:OnedataProjectsDMSReplicationSubnetGroup'
        VpcSecurityGroupIds: 
          - Fn::ImportValue: !Sub 'onedata-projects-resources-digital-DMS-components-${Environment}:OnedataProjectsDMSSecurityGroup'
        KmsKeyId: !Sub "arn:aws:kms:ap-southeast-2:${AWS::AccountId}:key/${DMSKMS}"
      ReplicationConfigIdentifier: !Sub "${Environment}-onedata-projects-serverless-full-cdc"
      ReplicationType: "full-load-and-cdc"
      ReplicationSettings:
        Logging:
          EnableLogging: "true"
        TargetMetadata:
          LobMaxSize: 16384
        FullLoadSettings:
          MaxFullLoadSubTasks: 24
          TargetTablePrepMode: "DO_NOTHING"
      ResourceIdentifier: !Sub "${Environment}-onedata-projects-serverless-full-cdc"
      SourceEndpointArn: !Sub "arn:aws:dms:ap-southeast-2:${AWS::AccountId}:endpoint:onedata-projects-src-db-${Environment}"
      TargetEndpointArn: !Sub "arn:aws:dms:ap-southeast-2:${AWS::AccountId}:endpoint:onedata-projects-tgt-s3-${Environment}"
