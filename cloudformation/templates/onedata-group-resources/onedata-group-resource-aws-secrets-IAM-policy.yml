AWSTemplateFormatVersion: '2010-09-09'

Description: >
  cloud formation template for onedata group resources

Parameters:
  DeployEnv:
    Type: String
  Environment:
    Type: String
  Account:
    Type: String
  SnowflakePrincipalArn:
    Type: String
    Description: "Snowflake Account ID"
  SnowflakeExternalId:
    Type: String
    Description: "Snowflake External ID"

Resources:
  IAMRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain 
    Properties:
      RoleName: !Sub "onedata-group-snowflake-integration-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              AWS: !Ref SnowflakePrincipalArn
            Action:
              - "sts:AssumeRole"
            Condition:
              StringEquals:
                sts:ExternalId: [
                  !Ref SnowflakeExternalId
                ]
      Path: "/"
      Policies:
        - 
          PolicyName: "onedata-group-snowflake-integration-role-secret-management-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: "Allow"
              Action:
                - "secretsmanager:GetSecretValue"
                - "secretsmanager:DescribeSecret"
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:one_data_snowflake_${Environment}_*"
