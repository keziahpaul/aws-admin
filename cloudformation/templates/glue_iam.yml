---
AWSTemplateFormatVersion: "2010-09-09"
Description: "Glue IAM role and policy for SecretsPolicy:"

Parameters:
  CFStackName:
    Type: String
  GluePrincipalArn:
    Type: String
    Description: "Glue AWS Account ID from where the GluePrincipalArn is being assumed."

Resources:
  IAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CFStackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              AWS: !Ref GluePrincipalArn
            Action:
              - "sts:AssumeRole"
      Path: "/"
      Policies:
        -
            PolicyName: !Sub "${CFStackName}-glue-secrets-policy"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                Effect: "Allow"
                Action:
                  - "secretsmanager:GetSecretValue"
                Resource: [
                  !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:onedata*glue-user-passphrase-*",
                  !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:onedata*glue-user-private-key-*"
                ]
        -
            PolicyName: !Sub "${CFStackName}-kms-policy"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                Effect: "Allow"
                Action:
                  - "kms:Decrypt"
                  - "kms:DescribeKey"
                Resource: [
                  !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*",
                  !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/*"
                ]
