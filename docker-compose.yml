version: "3.8"

services:
  pexa-one-data-snowflake-image:
    image: ${DOCKER_IMAGE}:latest
    entrypoint: []
    volumes:
      - .:/work
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - SNOWFLAKE_PRIVATE_KEY_PATH=dev_github_integration_user_private_key.p8
    env_file:
      - .env
    working_dir: /work
